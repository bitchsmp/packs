PerfectingShardWooden:
  Material: Amethyst_shard
  Display: '<#9e8629>Wooden <aqua>Perfecting Shard'
  Lore:
  - '<aqua>Add 0.1 Attack Damage to any wooden weapons'
  Augmentation:
    Type: WOODEN_PERFECTING_SHARD
    Tooltip: 'Add 0.1 Attack Damage'
    Conditions:
    Skills:
      - attributeModifier{attribute=ATTACK_DAMAGE;a=0.1;dur=1;operation=ADD_NUMBER} @self ~onTimer:1

