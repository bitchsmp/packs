SharpenerWooden:
  Material: IRON_NUGGET
  Display: '<#9e8629>Wooden <gold>Sharpener'
  Lore:
  - '<green>Add 1 Attack Damage to any wooden weapons'
  Augmentation:
    Type: WOODEN_SHARPENER
    Tooltip: 'Add 1 Attack Damage'
    Conditions:
    Skills:
      - attributeModifier{attribute=ATTACK_DAMAGE;a=1;dur=1;operation=ADD_NUMBER} @self ~onTimer:1

