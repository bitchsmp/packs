SculkScytheSkin:
  Material: DIAMOND
  Display: 'Special: <white>Freaky Sculk'
  Options:
    ItemModel: minecraft:sculk_sensor
  Lore:
  - <yellow><bold>Hoe Skin:</bold> Sculk Scythe
  - <white>
  - <gray>Inflicts target with Darkness effect</gray>
  - <white>
  - "<gradient:#024050:#61c3cb>[Darkness]"
  - "<white>  Inflicts target with Darkness effect for 5 seconds"
  - "<yellow>[Scythe]"
  - "<white>  Pulls the target upon hitting"
  
  Augmentation:
    Type: SKIN_HOE
    Tooltip: '<white>Sculk Scythe<gray> (Inflicts target with Darkness effect)' #Rarity color + Name
    ReplaceItemModel: sculkscythe
    ReplaceItemModelNamespace: minecraft
    Conditions:
    Skills:
    - skill{s=scythes_pull} @trigger ~onAttack
    - potion{type=DARKNESS;duration=100} @trigger ~onAttack