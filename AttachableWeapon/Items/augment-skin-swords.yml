SkinCreationSplitter:
  Material: DIAMOND
  Display: '<gold>Creation Splitter'
  Lore:
  - <yellow><bold>Sword Skin</bold>
  - <white>
  - <gray>Strip your target armor</gray>
  - <white>
  - "<light_purple>[Off-Guard]"
  - "<white>  Attacks reduce 20 armor point of the target; effect lasts for 10 seconds"
  - "<red>[⚠Stuck!]"
  - "<white>  Missing a swing disables the weapon for 2 seconds"
  Augmentation:
    Type: SKIN_SWORD
    Tooltip: '<gold>Creation Splitter<gray> (Strip your target armor)'
    ReplaceItemModel: creationsplitter
    ReplaceItemModelNamespace: minecraft
    Conditions:
    Skills:
    - stataura{stat=ARMOR;val=-20;type=ADDITIVE;aura=CREATIONSPLITTER_ARMOR_STRIPPER;duration=200;delay=1} @trigger ~onAttack ?!hasAura{aura=CREATIONSPLITTER_ATTACK_FAILED}
    - aura{aura=CREATIONSPLITTER_ATTACK_SUCCESS;ticks=2} @self ~onAttack
    - aura{aura=CREATIONSPLITTER_ATTACK_FAILED;delay=1;ticks=40;onstartskill=CREATIONSPLITTER_ATTACK_FAILED_FX;ontickskill=CREATIONSPLITTER_ATTACK_FAILED_FX_TICK} @self ~onSwing ?!hasAura{aura=CREATIONSPLITTER_ATTACK_SUCCESS} ?!hasAura{aura=CREATIONSPLITTER_ATTACK_FAILED}
    - aura{aura=CREATIONSPLITTER_ATTACK_DISABLE;ticks=2} @self ~onTimer:1 ?hasAura{aura=CREATIONSPLITTER_ATTACK_FAILED}

    - aura{aura=CREATIONSPLITTER_ATTACK_DISABLE_END2TICK_EARLY;ticks=2} @self ~onTimer:1 ?hasAura{aura=CREATIONSPLITTER_ATTACK_FAILED_END2TICK_EARLY}
    - cancelEvent ~onSwing ?hasAura{aura=CREATIONSPLITTER_ATTACK_DISABLE}
    - cancelEvent ~onAttack ?hasAura{aura=CREATIONSPLITTER_ATTACK_DISABLE}
    - potion{type=HASTE;level=99;hasparticles=false;hasicon=false;overwrite=true;duration=2} @self ~onTimer:1 ?hasAura{aura=CREATIONSPLITTER_ATTACK_DISABLE_END2TICK_EARLY}
    - potion{type=MINING_FATIGUE;level=99;hasparticles=false;hasicon=false;overwrite=true;duration=2} @self ~onTimer:1 ?hasAura{aura=CREATIONSPLITTER_ATTACK_DISABLE_END2TICK_EARLY}
SkinMoltenBlade:
  Material: DIAMOND
  Display: '<white>Molten Blade'
  Lore:
  - <yellow><bold>Sword Skin</bold>
  - <white>
  - <gray>Sharp as it was fresh from the furnace</gray>
  - <white>
  - "<yellow>[Fresh]"
  - "<white>  Deals 4 extra damage, but consumes twice the durability"
  Augmentation:
    Type: SKIN_SWORD
    Tooltip: '<white>Molten Blade<gray> (Sharp as it was fresh from the furnace)'
    ReplaceItemModel: moltenblade
    ReplaceItemModelNamespace: minecraft
    Conditions:
    Stats:
    Skills:
    - stataura{stat=ATTACK_DAMAGE;value=4;type=ADDITIVE;ticks=2;aura=MoltenBlade_damage_buff} ~onTimer:1 @self
    - consumehelddurability{a=1} @self ~onAttack ?!hasEnchant{type=UNBREAKING}
    - consumehelddurability{a=1;chance=0.5} @self ~onAttack ?hasEnchant{type=UNBREAKING;level=1}
    - consumehelddurability{a=1;chance=0.33} @self ~onAttack ?hasEnchant{type=UNBREAKING;level=2}
    - consumehelddurability{a=1;chance=0.25} @self ~onAttack ?hasEnchant{type=UNBREAKING;level=3}
