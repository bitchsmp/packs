SkinHolyMoonlightSword:
  Material: DIAMOND
  Display: '<aqua>Holy Moonlight Sword'
  Lore:
  - <white>
  - <yellow>Sword Skin
  - <gray>Becomes powerful at night, even more powerful on full moons, up to 6 extra damage</gray>
  - <white>
  - <light_purple>At night:</light_purple> +1 Attack Damage
  - <light_purple>During Full moon:</light_purple> +6 Attack Damage
  - <light_purple>During other moon phases except new moon:</light_purple> +3 Attack Damage
  Augmentation:
    Type: SKIN_SWORD
    Tooltip: '<aqua>Holy Moonlight Sword<gray> (Becomes powerful at night, even more powerful on full moons, up to 6 extra damage)'
    ReplaceItemModel: holymoonlightsword
    ReplaceItemModelNamespace: minecraft
    Conditions:
    Stats:
    Skills:
    - stataura{stat=ATTACK_DAMAGE;val=1;type=ADDITIVE;aura=HOLYMOONLIGHTSWORD_NIGHT_DAMAGE_BUFF;duration=5} @self ~onTimer:1 ?night
    - effect:particles{particle=end_rod;count=5;offset=0.5;speed=0;yoffset=0.1} @self ~onTimer:20 ?night

    - stataura{stat=ATTACK_DAMAGE;val=2;type=ADDITIVE;aura=HOLYMOONLIGHTSWORD_MOONPHASE1234567_DAMAGE_BUFF;duration=5} @self ~onTimer:1 ?lunarPhase{phases=1,2,3,4,5,6,7} ?night
    - effect:particles{particle=end_rod;count=3;offset=0.4;speed=0;yoffset=0} @self ~onTimer:10 ?lunarPhase{phases=1,2,3,4,5,6,7} ?night

    - stataura{stat=ATTACK_DAMAGE;val=5;type=ADDITIVE;aura=HOLYMOONLIGHTSWORD_MOONPHASE0_DAMAGE_BUFF;duration=5} @self ~onTimer:1 ?lunarPhase{phases=0} ?night
    - effect:particles{particle=end_rod;count=5;offset=0.6;speed=0;yoffset=0} @self ~onTimer:5 ?lunarPhase{phases=0} ?night
