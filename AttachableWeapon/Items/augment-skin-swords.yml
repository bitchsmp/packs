SkinBrimstone_Claymore:
  Material: DIAMOND
  Display: '<yellow>Brimstone Claymore'
  Lore:
  - <white>
  - <yellow>Sword Skin
  - <gray>Inflict <dark_red>UltraBurn</dark_red> on hit
  - <white>
  - <light_purple>Ultraburn:</light_purple>
  - <white>Causes unextinguishable burning effect
  Augmentation:
    Type: SKIN_SWORD
    Tooltip: '<yellow>Brimstone Claymore<gray> (Inflict <dark_red>UltraBurn</dark_red> on hit)'
    ReplaceItemModel: brimstone_claymore
    ReplaceItemModelNamespace: minecraft
    Conditions:
    Stats:
    Skills:
    - skill{s=UltraBurn} @trigger ~onAttack ?!itemRecharging{}
    - sound{sound=ultrakill:firestart;volume=0.6} @self ~onAttack ?!itemRecharging{}

SkinFrostBlade:
