SkinBrimstone_Claymore:
  Material: DIAMOND
  Display: '<red>Brimstone Claymore'
  Lore:
  - <gray>Inflict UltraBurn on hit
  Augmentation:
    Type: SKIN
    Tooltip: '<red>Brimstone Claymore<gray> (Inflict UltraBurn on hit)'
    ReplaceItemModel: brimstone_claymore
    ReplaceItemModelNamespace: minecraft
    Conditions:
    Stats:
    Skills:
    - skill{s=UltraBurn} @target ~onAttack ?!itemRecharging{}
    - sound{sound=ultrakill:firestart;volume=0.6} @self ~onAttack ?!itemRecharging{}

SkinFrostBlade:
  Material: DIAMOND
  Display: '<aqua>Frost Blade'
  Lore:
  - <gray>Inflict Freezing on hit
  Augmentation:
    Type: SKIN
    Tooltip: '<aqua>Frost Blade<gray> (Inflict Freezing on hit)'
    ReplaceItemModel: frostblade
    ReplaceItemModelNamespace: minecraft
    Conditions:
    Stats:
    Skills:
    - freeze{ticks=140} @target ~onAttack

SkinStopSign:
  Material: DIAMOND
  Display: 'Stop Sign'
  Lore:
  - <gray>Much higher damage and lower attack speed, also HITSTOPS!
  Augmentation:
    Type: SKIN
    Tooltip: 'Stop Sign<gray> (Much higher damage and lower attack speed, also HITSTOPS!)'
    ReplaceItemModel: stop_sign
    ReplaceItemModelNamespace: minecraft
    Conditions:
    Stats:
    - ATTACK_DAMAGE 2
    - ATTACK_SPEED -0.2 ADDITIVE
    Skills:
#Debug:
    # - message{m="1"} @self ?varequals{name=caster.stop_sign.is.falling;val="yes"}  ~onTimer:1
    # - message{m="0"} @self ?varequals{name=caster.stop_sign.is.falling;val="no";scope=caster}  ~onTimer:1

# code xấu, hạn chế học theo
#Condition checks:
    - setvariable{var=caster.stop_sign.is.falling;type=STRING;val="yes";scope=caster} @self ?fallspeed{s=>6} ~onTimer:1
    - setvariable{var=caster.stop_sign.is.falling;type=STRING;val="no";delay=1;scope=caster} @self ?!fallspeed{s=>6} ~onTimer:1
#on slam skills:
    - velocity{m=set;x=0;y=0;z=0;repeat=9;repeati=1} @self ~onAttack ?varequals{name=caster.stop_sign.is.falling;val="yes"}
    - velocity{m=set;x=0;y=0;z=0;repeat=9;repeati=1} @target ~onAttack ?varequals{name=caster.stop_sign.is.falling;val="yes"}

    - aura{aura=STOP_SIGN_PREVENT_DAMAGE;ticks=13;CancelOnChangeWorld=true;cancelondeath=false;DoEndSkillOnTerminate=false} @self ~onAttack ?varequals{name=caster.stop_sign.is.falling;val="yes"}
    - cancelEvent{} ~onDamaged @self ?hasAura{aura=STOP_SIGN_PREVENT_DAMAGE}

    - addtag{t=STOP_SIGN_MARKED_FOR_DAMAGED} @target ~onAttack ?varequals{name=caster.stop_sign.is.falling;val="yes"}
    - skill{s=STOP_SIGN_MARKED_FOR_DAMAGED;delay=10} @EIR{r=64} ~onAttack

    - sound{sound=ultrakill:hammerimpact;volume=1.1} @self ~onAttack ?varequals{name=caster.stop_sign.is.falling;val="yes"}
    - command{c="title <caster.name> times 0t 10t 0t";asTarget=true;asop=true} @self ~onAttack ?varequals{name=caster.stop_sign.is.falling;val="yes"}
    - potion{type=NIGHT_VISION;d=10} @self ~onAttack ?varequals{name=caster.stop_sign.is.falling;val="yes"}
    - skill{s=STOP_SIGN_WIND_BURST_0} @self ~onAttack ?varequals{name=caster.stop_sign.is.falling;val="yes"}
    - skill{s=STOP_SIGN_WIND_BURST_1} @self ~onAttack ?varequals{name=caster.stop_sign.is.falling;val="yes"}
    - skill{s=STOP_SIGN_WIND_BURST_2} @self ~onAttack ?varequals{name=caster.stop_sign.is.falling;val="yes"}
    - skill{s=STOP_SIGN_WIND_BURST_3} @self ~onAttack ?varequals{name=caster.stop_sign.is.falling;val="yes"}

#if entity killed by the slam attack before fx skills trigger:
    - effect:firework{t=BALL_LARGE;d=0;delay=10;f=true} ~onKill ?varequals{name=caster.stop_sign.is.falling;val="yes"}
SkinHolyMoonlightSword:
  Material: DIAMOND
  Display: '<aqua>Holy Moonlight Sword'
  Lore:
  - <gray>Becomes powerful at night, even more powerful on full moons
  Augmentation:
    Type: SKIN
    Tooltip: '<aqua>Holy Moonlight Sword<gray> (Becomes powerful at night, even more powerful on full moons)'
    ReplaceItemModel: holymoonlightsword
    ReplaceItemModelNamespace: minecraft
    Conditions:
    Stats:
    Skills:
    - stataura{stat=ATTACK_DAMAGE;val=1;type=ADDITIVE;aura=HOLYMOONLIGHTSWORD_NIGHT_DAMAGE_BUFF;duration=5} @self ~onTimer:1 ?night
    - effect:particles{particle=end_rod;count=5;offset=0.5;speed=0;yoffset=0.1} @self ~onTimer:20 ?night

    - stataura{stat=ATTACK_DAMAGE;val=1;type=ADDITIVE;aura=HOLYMOONLIGHTSWORD_MOONPHASE23456_DAMAGE_BUFF;duration=5} @self ~onTimer:1 ?lunarPhase{phases=2,3,4,5,6} ?night
    - effect:particles{particle=end_rod;count=3;offset=0.4;speed=0;yoffset=0} @self ~onTimer:10 ?lunarPhase{phases=2,3,4,5,6}

    - stataura{stat=ATTACK_DAMAGE;val=4;type=ADDITIVE;aura=HOLYMOONLIGHTSWORD_MOONPHASE017_DAMAGE_BUFF;duration=5} @self ~onTimer:1 ?lunarPhase{phases=0,1,7} ?night
    - effect:particles{particle=end_rod;count=5;offset=0.6;speed=0;yoffset=0} @self ~onTimer:5 ?lunarPhase{phases=0,1,7}
SkinSabre:
  Material: DIAMOND
  Display: 'Sabre'
  Lore:
  - <gray>Deals more damage when in water
  Augmentation:
    Type: SKIN
    Tooltip: '<white>Sabre<gray> (Deals 2 more damage when in water)'
    ReplaceItemModel: sabre
    ReplaceItemModelNamespace: minecraft
    Conditions:
    Stats:
    Skills:
    - stataura{stat=ATTACK_DAMAGE;val=2;type=ADDITIVE;aura=SABRE_WATER_DAMAGE_BUFF;duration=5} @self ~onTimer:1 ?inblock{type=WATER}