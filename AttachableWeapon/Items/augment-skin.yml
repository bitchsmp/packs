SkinBrimstone_Claymore:
  Material: DIAMOND
  Display: '<red>Brimstone Claymore'
  Lore:
  - <gray>Inflict UltraBurn on hit
  Augmentation:
    Type: SKIN
    Tooltip: '<red>Brimstone Claymore<gray> (Inflict UltraBurn on hit)'
    ReplaceItemModel: brimstone_claymore
    ReplaceItemModelNamespace: minecraft
    Conditions:
    Stats:
    Skills:
    - skill{s=UltraBurn} @trigger ~onAttack ?!itemRecharging{}
    - sound{sound=ultrakill:firestart;volume=0.6} @self ~onAttack ?!itemRecharging{}

SkinFrostBlade:
  Material: DIAMOND
  Display: '<aqua>Frost Blade'
  Lore:
  - <gray>Inflict Freezing on hit
  Augmentation:
    Type: SKIN
    Tooltip: '<aqua>Frost Blade<gray> (Inflict Freezing on hit)'
    ReplaceItemModel: frostblade
    ReplaceItemModelNamespace: minecraft
    Conditions:
    Stats:
    Skills:
    - freeze{ticks=140} @trigger ~onAttack

SkinStopSign:
  Material: DIAMOND
  Display: '<orange>Stop Sign'
  Lore:
  - <gray>Much higher damage and lower attack speed, also HITSTOPS!
  Augmentation:
    Type: SKIN
    Tooltip: 'Stop Sign<gray> (Much higher damage and lower attack speed, also HITSTOPS!)'
    ReplaceItemModel: stop_sign
    ReplaceItemModelNamespace: minecraft
    Conditions:
    Stats:
    - ATTACK_DAMAGE 2
    - ATTACK_SPEED -0.2 ADDITIVE
    Skills:
#Debug:
    # - message{m="0";cooldown=0.5} @self ?varequals{name=caster.stop_sign.is.falling;val="no";scope=caster}  ~onTimer:1
    # - message{m="1"} @self ?varequals{name=caster.stop_sign.is.falling;val="1"}  ~onTimer:1
    # - message{m="2"} @self ?varequals{name=caster.stop_sign.is.falling;val="2"}  ~onTimer:1
    # - message{m="3"} @self ?varequals{name=caster.stop_sign.is.falling;val="3"}  ~onTimer:1
    # - message{m="4"} @self ?varequals{name=caster.stop_sign.is.falling;val="4"}  ~onTimer:1
# code xấu, hạn chế học theo
#Condition checks:
    - setvariable{var=caster.stop_sign.is.falling;type=STRING;val="no";delay=2;scope=caster} @self ?directionalvelocity{y=>-0.4}  ~onTimer:1
    - setvariable{var=caster.stop_sign.is.falling;type=STRING;val="1";scope=caster} @self ?directionalvelocity{y=<-0.4} ?directionalvelocity{y=>-0.6} ~onTimer:1
    - setvariable{var=caster.stop_sign.is.falling;type=STRING;val="2";scope=caster} @self ?directionalvelocity{y=<-0.6} ?directionalvelocity{y=>-0.8} ~onTimer:1
    - setvariable{var=caster.stop_sign.is.falling;type=STRING;val="3";scope=caster} @self ?directionalvelocity{y=<-0.8} ?directionalvelocity{y=>-1.2} ~onTimer:1
    - setvariable{var=caster.stop_sign.is.falling;type=STRING;val="4";scope=caster} @self ?directionalvelocity{y=<-1.2} ~onTimer:1
# 1: 0s hitstop
# 2: 0.15s hitstop
# 3: 0.2s hitstop
# 4: 0.5s hitstop
#on slam skills 1:


    - aura{aura=STOP_SIGN_PREVENT_DAMAGE;ticks=1;CancelOnChangeWorld=true;cancelondeath=false;DoEndSkillOnTerminate=false} @self ~onAttack ?varequals{name=caster.stop_sign.is.falling;val="1"}
    - cancelEvent{} ~onDamaged @self ?hasAura{aura=STOP_SIGN_PREVENT_DAMAGE}

    - skill{s=STOP_SIGN_MARKED_FOR_DAMAGED_1} @trigger ~onAttack ?varequals{name=caster.stop_sign.is.falling;val="1"}

    - sound{sound=ultrakill:hammerimpact;volume=0.9} @self ~onAttack ?varequals{name=caster.stop_sign.is.falling;val="1"}
    - skill{s=STOP_SIGN_WIND_BURST_0_1} @self ~onAttack ?varequals{name=caster.stop_sign.is.falling;val="1"}
    - skill{s=STOP_SIGN_WIND_BURST_1_1} @self ~onAttack ?varequals{name=caster.stop_sign.is.falling;val="1"}
    - skill{s=STOP_SIGN_WIND_BURST_2_1} @self ~onAttack ?varequals{name=caster.stop_sign.is.falling;val="1"}
    - skill{s=STOP_SIGN_WIND_BURST_3_1} @self ~onAttack ?varequals{name=caster.stop_sign.is.falling;val="1"}
#on slam skills 2:
    - velocity{m=set;x=0;y=0;z=0;repeat=2;repeati=1} @self ~onAttack ?varequals{name=caster.stop_sign.is.falling;val="2"}
    - velocity{m=set;x=0;y=0;z=0;repeat=2;repeati=1} @target ~onAttack ?varequals{name=caster.stop_sign.is.falling;val="2"}

    - aura{aura=STOP_SIGN_PREVENT_DAMAGE;ticks=6;CancelOnChangeWorld=true;cancelondeath=false;DoEndSkillOnTerminate=false} @self ~onAttack ?varequals{name=caster.stop_sign.is.falling;val="2"}
    - cancelEvent{} ~onDamaged @self ?hasAura{aura=STOP_SIGN_PREVENT_DAMAGE}

    - skill{s=STOP_SIGN_MARKED_FOR_DAMAGED_2;delay=3} @trigger ~onAttack ?varequals{name=caster.stop_sign.is.falling;val="2"}

    - sound{sound=ultrakill:hammerimpact;volume=1.0} @self ~onAttack ?varequals{name=caster.stop_sign.is.falling;val="2"}
    - skill{s=STOP_SIGN_WIND_BURST_0_2} @self ~onAttack ?varequals{name=caster.stop_sign.is.falling;val="2"}
    - skill{s=STOP_SIGN_WIND_BURST_1_2} @self ~onAttack ?varequals{name=caster.stop_sign.is.falling;val="2"}
    - skill{s=STOP_SIGN_WIND_BURST_2_2} @self ~onAttack ?varequals{name=caster.stop_sign.is.falling;val="2"}
    - skill{s=STOP_SIGN_WIND_BURST_3_2} @self ~onAttack ?varequals{name=caster.stop_sign.is.falling;val="2"}
#on slam skills 3:
    - velocity{m=set;x=0;y=0;z=0;repeat=3;repeati=1} @self ~onAttack ?varequals{name=caster.stop_sign.is.falling;val="3"}
    - velocity{m=set;x=0;y=0;z=0;repeat=3;repeati=1} @target ~onAttack ?varequals{name=caster.stop_sign.is.falling;val="3"}

    - aura{aura=STOP_SIGN_PREVENT_DAMAGE;ticks=7;CancelOnChangeWorld=true;cancelondeath=false;DoEndSkillOnTerminate=false} @self ~onAttack ?varequals{name=caster.stop_sign.is.falling;val="3"}
    - cancelEvent{} ~onDamaged @self ?hasAura{aura=STOP_SIGN_PREVENT_DAMAGE}

    - skill{s=STOP_SIGN_MARKED_FOR_DAMAGED_3;delay=4} @trigger ~onAttack ?varequals{name=caster.stop_sign.is.falling;val="3"}

    - sound{sound=ultrakill:hammerimpact;volume=1.1} @self ~onAttack ?varequals{name=caster.stop_sign.is.falling;val="3"}
    - skill{s=STOP_SIGN_WIND_BURST_0_3} @self ~onAttack ?varequals{name=caster.stop_sign.is.falling;val="3"}
    - skill{s=STOP_SIGN_WIND_BURST_1_3} @self ~onAttack ?varequals{name=caster.stop_sign.is.falling;val="3"}
    - skill{s=STOP_SIGN_WIND_BURST_2_3} @self ~onAttack ?varequals{name=caster.stop_sign.is.falling;val="3"}
    - skill{s=STOP_SIGN_WIND_BURST_3_3} @self ~onAttack ?varequals{name=caster.stop_sign.is.falling;val="3"}
#on slam skills 4:
    - velocity{m=set;x=0;y=0;z=0;repeat=9;repeati=1} @self ~onAttack ?varequals{name=caster.stop_sign.is.falling;val="4"}
    - velocity{m=set;x=0;y=0;z=0;repeat=9;repeati=1} @target ~onAttack ?varequals{name=caster.stop_sign.is.falling;val="4"}

    - aura{aura=STOP_SIGN_PREVENT_DAMAGE;ticks=13;CancelOnChangeWorld=true;cancelondeath=false;DoEndSkillOnTerminate=false} @self ~onAttack ?varequals{name=caster.stop_sign.is.falling;val="4"}
    - cancelEvent{} ~onDamaged @self ?hasAura{aura=STOP_SIGN_PREVENT_DAMAGE}

    - skill{s=STOP_SIGN_MARKED_FOR_DAMAGED_4;delay=10} @trigger ~onAttack ?varequals{name=caster.stop_sign.is.falling;val="4"}

    - potion{type=NIGHT_VISION;duration=10;hasparticles=false} @self ~onAttack ?varequals{name=caster.stop_sign.is.falling;val="4"}
    - sound{sound=ultrakill:hammerimpact;volume=1.2} @self ~onAttack ?varequals{name=caster.stop_sign.is.falling;val="4"}
    - skill{s=STOP_SIGN_WIND_BURST_0_4} @self ~onAttack ?varequals{name=caster.stop_sign.is.falling;val="4"}
    - skill{s=STOP_SIGN_WIND_BURST_1_4} @self ~onAttack ?varequals{name=caster.stop_sign.is.falling;val="4"}
    - skill{s=STOP_SIGN_WIND_BURST_2_4} @self ~onAttack ?varequals{name=caster.stop_sign.is.falling;val="4"}
    - skill{s=STOP_SIGN_WIND_BURST_3_4} @self ~onAttack ?varequals{name=caster.stop_sign.is.falling;val="4"}

#if entity killed by the slam attack before fx skills trigger:
    - effect:firework{t=BALL;d=0;delay=3;f=true} ~onKill ?varequals{name=caster.stop_sign.is.falling;val="2"}
    - effect:firework{t=BALL_LARGE;d=0;delay=4;f=true;colors=#FFDF00;fadecolors=#FFFFFF} ~onKill ?varequals{name=caster.stop_sign.is.falling;val="3"}
    - effect:firework{t=BALL_LARGE;d=0;delay=10;f=true;colors=#FF5252;fadecolors=#FFFFFF} ~onKill ?varequals{name=caster.stop_sign.is.falling;val="4"}
SkinHolyMoonlightSword:
  Material: DIAMOND
  Display: '<aqua>Holy Moonlight Sword'
  Lore:
  - <gray>Becomes powerful at night, even more powerful on full moons
  Augmentation:
    Type: SKIN
    Tooltip: '<aqua>Holy Moonlight Sword<gray> (Becomes powerful at night, even more powerful on full moons)'
    ReplaceItemModel: holymoonlightsword
    ReplaceItemModelNamespace: minecraft
    Conditions:
    Stats:
    Skills:
    - stataura{stat=ATTACK_DAMAGE;val=1;type=ADDITIVE;aura=HOLYMOONLIGHTSWORD_NIGHT_DAMAGE_BUFF;duration=5} @self ~onTimer:1 ?night
    - effect:particles{particle=end_rod;count=5;offset=0.5;speed=0;yoffset=0.1} @self ~onTimer:20 ?night

    - stataura{stat=ATTACK_DAMAGE;val=1;type=ADDITIVE;aura=HOLYMOONLIGHTSWORD_MOONPHASE23456_DAMAGE_BUFF;duration=5} @self ~onTimer:1 ?lunarPhase{phases=2,3,4,5,6} ?night
    - effect:particles{particle=end_rod;count=3;offset=0.4;speed=0;yoffset=0} @self ~onTimer:10 ?lunarPhase{phases=2,3,4,5,6}

    - stataura{stat=ATTACK_DAMAGE;val=4;type=ADDITIVE;aura=HOLYMOONLIGHTSWORD_MOONPHASE017_DAMAGE_BUFF;duration=5} @self ~onTimer:1 ?lunarPhase{phases=0,1,7} ?night
    - effect:particles{particle=end_rod;count=5;offset=0.6;speed=0;yoffset=0} @self ~onTimer:5 ?lunarPhase{phases=0,1,7}
