SkinUnaryLivingFire:
  Material: TURTLE_SCUTE
  Display: 'Special: <white>Living Flame'
  Options:
    ItemModel: minecraft:fire_floor0_emissive
  Lore:
  - <yellow><bold>Axe Skin:</bold> Unary Living Fire
  - <white>
  - <gray>Summons one orbiting living fire</gray>
  - <white>
  - "<gold>[Orbiting Flame]"
  - "<white>  Deals 1 damage and causes burning on hit"
  Augmentation:
    Type: SKIN_AXE
    Tooltip: '<white>Unary Living Fire<gray> (Summons one orbiting living fire)'
    Conditions:
    Skills:
    - skill{s=unary_living_fire_orbital_projectile} @self ~onTimer:64

