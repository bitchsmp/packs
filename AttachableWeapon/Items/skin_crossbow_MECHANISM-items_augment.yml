SkinAlternateCrossbow:
  Material: TURTLE_SCUTE
  Display: '<white>Alternate Mechanism'
  Options:
    ItemModel: paper
  Lore:
  - <yellow><bold>Crossbow Skin:</bold> Alternate Crossbow
  - <white>
  - <gray>Turns shooted projectile into hitscans</gray>
  - <white>
  - "<aqua>[Hitscan]"
  Augmentation:
    Type: SKIN_CROSSBOW
    Tooltip: '<yellow>Alternate<gray> (Turns shooted projectile into hitscans)'
    ReplaceItemModel: dueris:alternate_crossbow
    Conditions:
    Stats:
    Skills:
    - variableSet{value=20;type=INTEGER;name=caster.alternate_crossbow_heat} ~onTimer:1 @self ?!varset{name=caster.alternate_crossbow_heat}
    - aura{aura=alternate_crossbow_heat_aura;ticks=600;interval=10;ontickskill=alternate_crossbow_heat_tick} @self ~onTimer:1
    - skill{skill=alternate_crossbow_onShoot} ~onShoot @Self ?!varrange{name=caster.alternate_crossbow_heat;value=>600;onfailskill=alternate_crossbow_projectile_overheat}
    - cancelEvent ~onShoot
 
    - skill{skill=[
      - actionmessage{message="<red><caster.var.alternate_crossbow_heat> °C"} @self ?varrange{name=caster.alternate_crossbow_heat;value=>500}
      - actionmessage{message="<gold><caster.var.alternate_crossbow_heat> °C"} @self ?varrange{name=caster.alternate_crossbow_heat;value=>400} ?varrange{name=caster.alternate_crossbow_heat;value=<501}
      - actionmessage{message="<yellow><caster.var.alternate_crossbow_heat> °C"} @self ?varrange{name=caster.alternate_crossbow_heat;value=>300} ?varrange{name=caster.alternate_crossbow_heat;value=<401}
      - actionmessage{message="<white><caster.var.alternate_crossbow_heat> °C"} @self ?varrange{name=caster.alternate_crossbow_heat;value=<301} 
      ]} ~onTimer:10 @self




