SkinNapalm_Claymore:
# Original name from Blade of Majestica rspack: Brimstone_Claymore
  Material: TURTLE_SCUTE
  Display: 'Canister: <yellow>Napalm B'
  Options:
    ItemModel: hbm:canister_napalm
  Lore:
  - <yellow><bold>Sword Skin:</bold> Napalm Claymore
  - <white>
  - <gray>Inflicts UltraBurn on hit</gray>
  - <white>
  - "<dark_red>[UltraBurn]"
  - "<white>  Causes unextinguishable burning effect to the target"
  Augmentation:
    Type: SKIN_SWORD
    Tooltip: '<yellow>Napalm Claymore<gray> (Inflicts <dark_red>UltraBurn</dark_red> on hit)'
    ReplaceItemModel: brimstone_claymore
    ReplaceItemModelNamespace: minecraft
    Conditions:
    Stats:
    Skills:
    - aura{aura=UltraBurn;duration=200;interval=20;ontickskill=[
      - damage{a=0.5;preventknockback=true}
      - effect:particles{particle=flame;amount=50;hS=0.1;vS=0.1;speed=0.3}
      - ignite{ticks=200}
      ]} @trigger ~onAttack ?!itemRecharging{}
    - sound{sound=ultrakill:firestart;volume=0.6} @self ~onAttack ?!itemRecharging{}
SkinFrostBlade:
  Material: TURTLE_SCUTE
  Display: '<white>Universal Fluid Barrel: Liquid Nitrogen'
  Options:
    ItemModel: hbm:fluid_barrel_nitrogen
  Lore:
  - <yellow><bold>Sword Skin:</bold> Frost Blade
  - <white>
  - <gray>Inflict Freezing on hit</gray>
  - <white>
  - "<aqua>[Freezing]"
  Augmentation:
    Type: SKIN_SWORD
    Tooltip: '<white>Frost Blade<gray> (Inflict Freezing on hit)'
    ReplaceItemModel: frostblade
    ReplaceItemModelNamespace: minecraft
    Conditions:
    Stats:
    Skills:
    - freeze{ticks=140} @trigger ~onAttack


