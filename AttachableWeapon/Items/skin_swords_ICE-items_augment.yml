SkinIcy:
  Material: TURTLE_SCUTE
  Display: 'Special: <white>Non-meltable Snowball'
  Options:
    ItemModel: minecraft:snowball
    Glint: true
  Lore:
  - <yellow><bold>Sword Skin:</bold> Icy
  - <white>
  - "<gray><italic>A little bit cold, isn't it?</italic></gray>"
  - <white>
  - "<aqua>[Freezing]"
  - <gray>  Inflicts Freezing on hit</gray>
  Augmentation:
    Type: SKIN_SWORD
    Tooltip: "<white>Icy<gray> (<italic>A little bit cold, isn't it?</italic>)"
    Conditions:
    Skills:
    - freeze{ticks=140} @trigger ~onAttack
SkinGlacial:
  Material: TURTLE_SCUTE
  Display: 'Special: <white>Ball of the colds'
  Options:
    ItemModel: minecraft:snowball
    Glint: true
  Lore:
  - <yellow><bold>Sword Skin:</bold> Glacial
  - <white>
  - "<gray><italic>Somewhat cold, isn't it?</italic></gray>"
  - <white>
  - "<aqua>[Bone-chilling]"
  - "<gray>  Hitting target twice in a row(6 seconds window) inflicts Bone-chilling effect</gray>"
  - "<gray>  75% chance to deal 4 extra damages to enemy with Bone-chilling effect"
  Augmentation:
    Type: SKIN_SWORD
    Tooltip: "<white>Glacial<gray> (<italic>Somewhat cold, isn't it?</italic>)"
    Skills:
    - ondamaged{aura=bone-chilling;ticks=60;maxstacks=3;ondamagedskill=glacial_damage} @trigger ~onAttack
SkinBlizzard:
  Material: TURTLE_SCUTE
  Display: 'Special: <white>Low-Entropy Frost Sphere'
  Options:
    ItemModel: minecraft:snowball
    Glint: true
  Lore:
  - <yellow><bold>Sword Skin:</bold> Blizzard
  - <white>
  - "<gray><italic>My god why is it so cold? Like a <bold>blizzard</bold></italic></gray>"
  - <white>
  - "<aqua>[Hypothermic]"
  - <gray>  Inflicts Hypothermic effect on hit, deals 1 freeze damage overtime. The effect lasts for a minute</gray>
  Augmentation:
    Type: SKIN_SWORD
    Tooltip: "<white>Blizzard<gray> (<italic>My god why is it so cold? Like a <bold>blizzard</bold></italic>)"
    Conditions:
    Skills:
    - aura{aura=hypothermic;ticks=1200;interval=80;ontickskill=[
      - freeze{ticks=140}
      - damage{amount=1;damagecause=FREEZE}
      - sudoskill{skill=[
        - summon{type=blizzard_display;pitch=0;yaw=0} @selfLocation 
      ]}
      
      ]} @trigger ~onAttack
