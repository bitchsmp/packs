SkinIcy:
  Material: TURTLE_SCUTE
  Display: 'Special: <white>Non-meltable Snowball'
  Options:
    ItemModel: minecraft:snowball
    Glint: true
  Lore:
  - <yellow><bold>Sword Skin:</bold> Icy
  - <white>
  - "<gray><italic>A little bit cold, isn't it?</italic></gray>"
  - <white>
  - "<aqua>[Freezing]"
  - <gray>  Inflicts Freezing on hit</gray>
  Augmentation:
    Type: SKIN_SWORD
    Tooltip: "<white>Icy<gray> (<italic>A little bit cold, isn't it?</italic>)"
    Conditions:
    Skills:
    - freeze{ticks=140} @trigger ~onAttack
SkinGlacial:
  Material: TURTLE_SCUTE
  Display: 'Special: <white>Ball of the colds'
  Options:
    ItemModel: minecraft:snowball
    Glint: true
  Lore:
  - <yellow><bold>Sword Skin:</bold> Glacial
  - <white>
  - "<gray><italic>Somewhat cold, isn't it?</italic></gray>"
  - <white>
  - "<aqua>[Bone-chilling]"
  - "<gray>  Hitting target three times in a row(6 seconds window) inflicts Bone-chilling effect</gray>"
  - "<gray>  75% chance to deal 4 bonus damage to enemy with Bone-chilling effect"
  Augmentation:
    Type: SKIN_SWORD
    Tooltip: "<white>Glacial<gray> (<italic>Somewhat cold, isn't it?</italic>)"
    Skills:
    - ondamaged{aura=bone-chilling;ticks=60;maxstacks=3;ondamagedskill=glacial_damage} @trigger ~onAttack
SkinBlizzard:
  Material: TURTLE_SCUTE
  Display: 'Special: <white>Low-Entropy Frost Sphere'
  Options:
    ItemModel: minecraft:snowball
    Glint: true
  Lore:
  - <yellow><bold>Sword Skin:</bold> Blizzard
  - <white>
  - "<gray><italic>Cold like a <bold>blizzard</bold></italic></gray>"
  - <white>
  - "<aqua>[Low-Entropy Domain]"
  - "<gray>  Right-clicking creates a Low-entropy domain with a radius of 16 blocks. 60 seconds cooldown</gray>"
  - "<gray>  Any entites in the domain would experience slight cold, reducing their movement speed</gray>"
  Augmentation:
    Type: SKIN_SWORD
    Tooltip: "<white>Blizzard<gray> (<italic>Cold like a <bold>blizzard</bold></italic>)"
    Conditions:
    Skills:
    - skill{s=[
      - summon{type=blizzard_marker;a=1;delay=80} @selfLocation
      - potion{type=BLINDNESS;duration=100} @EIR{radius=16;targetself=true}
      ];cooldown=60} ~onUse
    
#Experimental
SkinExperimental:
  Material: TURTLE_SCUTE
  Display: 'Special: <white>Ball of the colds'
  Options:
    ItemModel: minecraft:snowball
    Glint: true
  Lore:
  - <yellow><bold>Sword Skin:</bold> Glacial
  - <white>
  - "<gray><italic>Somewhat cold, isn't it?</italic></gray>"
  - <white>
  - "<aqua>[Bone-chilling]"
  - <gray>  Inflicts Bone-chilling effect on hit, slows down the target.</gray>
  Augmentation:
    Type: SKIN_SWORD
    Tooltip: "<white>Glacial<gray> (<italic>Somewhat cold, isn't it?</italic>)"
    Conditions:
    Skills:
    - aura{aura=bone-chilling;ticks=200;ontickskill=[
      - freeze{ticks=20}
      - potion{type=SLOWNESS;duration=20;level=0}
      ]} @trigger ~onAttack
