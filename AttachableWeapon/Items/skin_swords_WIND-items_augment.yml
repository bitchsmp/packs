SkinBreezer:
  Material: TURTLE_SCUTE
  Display: "Special: <white>Wind Essence"
  Options:
    ItemModel: minecraft:wind_charge
    Glint: true
  Lore:
  - <yellow><bold>Sword Skin:</bold> Breezer
  - <white>
  - <gray>Fire a gust of wind upon swinging</gray>
  - <white>
  - "<white>[Gust]"
  - "<white>  Fire a gust of wind upon swinging"
  Augmentation:
    Type: SKIN_SWORD
    Tooltip: '<white>Breezer<gray> (Fire a gust of wind upon swinging)'
    Conditions:
    Skills:
    - skill{s=breezer_projectile;cooldown=3} @self ~onSwing
SkinGale:
  Material: TURTLE_SCUTE
  Display: "Special: <white>Wind Essence"
  Options:
    ItemModel: minecraft:wind_charge
    Glint: true
  Lore:
  - <yellow><bold>Sword Skin:</bold> Gale
  - <white>
  - <gray>Grants you faster movement speed</gray>
  - <white>
  - "<white>[Booster Gale]"
  - "<white>  Grants you faster movement speed on right-click"
  Augmentation:
    Type: SKIN_SWORD
    Tooltip: '<white>Gale<gray> (Grants you faster movement speed)'
    Conditions:
    Skills:
    - stataura{forcesync=true;stat=MOVEMENT_SPEED;type=ADDITIVE;value=0.1;duration=60;interval=2;ontickskill=[
      - particle{particle=small_gust;vspread=0.7;hspread=0.3;a=1;yoffset=0.5}
      ];onstartskill=[
      - particle{particle=gust;a=1;yoffset=1}
      - sound{sound=entity.breeze.wind_burst;volume=0.8;pitch=0.8}
      ];cooldown=5} @self ~onUse

