SKIN:
  Enabled: true
  Display: 'Skin'
  Formatting:
    Empty: '<augment.icon> Default <augment.type>'
    Filled: '<augment.icon> <augment.type>: <augment.tooltip>'
  Icons:
    Empty: '☆'
    Filled: '★'
    Invalid: ''
SHARPENER:
  Enabled: true
  Display: 'Sharpener'
  Formatting:
    Empty: '<red>Not sharpened'
    Filled: '<white>Sharpened: <augment.tooltip>'
  Icons:
    Empty: '☆'
    Filled: '★'
    Invalid: ''
SMITHING_STONE:
  Enabled: true
  Display: 'Smithing Stone'
  Formatting:
    Empty: '<red>Not re-smithed'
    Filled: '<gold>Re-smithed: <augment.tooltip>'
  Icons:
    Empty: '☆'
    Filled: '★'
    Invalid: ''
PERFECTING_SHARD:
  Enabled: true
  Display: 'Perfecting Shard'
  Formatting:
    Empty: '<red>Not perfected'
    Filled: '<aqua>Perfected: <augment.tooltip>'
  Icons:
    Empty: '☆'
    Filled: '★'
    Invalid: ''
