SKIN:
  Enabled: true
  Display: 'Skin'
  Formatting:
    Empty: '<augment.icon> Default <augment.type>'
    Filled: '<augment.icon> <augment.type>: <augment.tooltip>'
  Icons:
    Empty: '☆'
    Filled: '★'
    Invalid: ''
SHARPENER:
  Enabled: true
  Display: 'Sharpener'
  Formatting:
    Empty: '<red><augment.icon> Not sharpened'
    Filled: '<green><augment.icon> Sharpened: <augment.tooltip>'
  Icons:
    Empty: '✖'
    Filled: '✔'
    Invalid: ''

PERFECTING_SHARD:
  Enabled: true
  Display: 'Perfecting Shard'
  Formatting:
    Empty: '<#a16357><augment.icon> Not Perfected'
    Filled: '<aqua><augment.icon> Perfected: <augment.tooltip>'
  Icons:
    Empty: '💩'
    Filled: '💎'
    Invalid: ''
