GreatBow_marker:
  Type: Interaction
  Options:
    Width: 1
    Height: 1
    Responsive: false
    Despawn: NORMAL
    SummonerIsOwner: true
  Skills:
  - teleport{unsafe=true} @ownerlocation{yoffset=32} ~onTimer:1
  - remove{delay=25} @self ~onSpawn

GreatBow_arrowrain_marker:
  Type: Marker
  Options:
    Width: 1
    Height: 1
    Responsive: false
    Despawn: NORMAL
    SummonerIsOwner: true
  Skills:
  - remove{delay=100} @self ~onSpawn