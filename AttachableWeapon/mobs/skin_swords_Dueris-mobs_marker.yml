breezer_projectile_marker:
  Type: marker
  Skills:
  - setVar{type=STRING;value="{Motion:[0d,-1d,0d]}";name=global.breezer_wind_charge_motion_down}
  - command{command="summon minecraft:breeze_wind_charge ~ ~ ~ <global.var.breezer_wind_charge_motion_down>";asop=true;sourceisorigin=true;astarget=true} @self ~onSpawn
  - remove{delay=2} @self ~onSpawn
squall_projectile_marker:
  Type: marker
  Skills:
  - setVar{type=STRING;value="{Motion:[0d,-1d,0d]}";name=global.breezer_wind_charge_motion_down}
  - command{command="summon minecraft:breeze_wind_charge ~ ~ ~ <global.var.breezer_wind_charge_motion_down>";asop=true;sourceisorigin=true;astarget=true;repeat=2} @self ~onSpawn
  - remove{delay=2} @self ~onSpawn
blizzard_marker:
  Type: marker
  Skills:
  - particlesphere{radius=16;particle=snowflake;amount=5;points=64;spread=0.3} @self ~onTimer:1
  - skill{s=[
    - effect:blockmask{m=packed_ice;r=2}
    - delay 1
    - effect:blockmask{m=packed_ice;r=4}
    - delay 1
    - effect:blockmask{m=packed_ice;r=6}
    - delay 1
    - effect:blockmask{m=packed_ice;r=8}
    - delay 1
    - effect:blockmask{m=packed_ice;r=10}
    - delay 1
    - effect:blockmask{m=packed_ice;r=12}
    - delay 1
    - effect:blockmask{m=packed_ice;r=14}
    - delay 1
    - effect:blockmask{m=packed_ice;r=16}
    ]} @self ~onSpawnorLoad
  
  - blockUnmask{r=16;delay=600} @self ~onSpawnorLoad
  - sound{sound=entity.warden.sonic_boom;pitch=1.5} @self ~onSpawnorLoad
  - sound{sound=entity.generic.explode;pitch=0.5} @self ~onSpawnorLoad
  - freeze{ticks=40} ~onTimer:1 @EIR{r=16;targetowner=false}
  - remove{delay=601} @self ~onSpawnorLoad
permafrost_marker:
  Type: marker
  Skills:
  - particlesphere{radius=32;particle=snowflake;amount=5;points=64;spread=0.3} @self ~onTimer:1
  - freeze{ticks=80} ~onTimer:1 @EIR{r=32;targetowner=false}
  - skill{s=[
    - effect:blockmask{m=blue_ice;r=4;duration=900}
    - delay 1
    - effect:blockmask{m=blue_ice;r=8;duration=900}
    - delay 1
    - effect:blockmask{m=blue_ice;r=12;duration=900}
    - delay 1
    - effect:blockmask{m=blue_ice;r=16;duration=900}
    - delay 1
    - effect:blockmask{m=blue_ice;r=20;duration=900}
    - delay 1
    - effect:blockmask{m=blue_ice;r=24;duration=900}
    - delay 1
    - effect:blockmask{m=blue_ice;r=28;duration=900}
    - delay 1
    - effect:blockmask{m=blue_ice;r=32;duration=900}
    ]} @self ~onSpawnorLoad
  
  - blockUnmask{r=32;delay=901} @self ~onSpawnorLoad
  - sound{sound=entity.warden.sonic_boom;pitch=1.5;radius=32} @self ~onSpawnorLoad
  - sound{sound=entity.ender_dragon.growl;pitch=0.5;radius=32} @self ~onSpawnorLoad

  - remove{delay=902} @self ~onSpawnorLoad