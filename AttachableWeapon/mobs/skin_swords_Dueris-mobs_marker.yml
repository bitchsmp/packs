breezer_wind_projectile_marker:
  Type: marker
  Skills:
  - setVar{type=STRING;value="{Motion:[0d,-1d,0d]}";name=global.breezer_wind_charge_motion_down}
  - command{command="summon minecraft:breeze_wind_charge ~ ~ ~ <global.var.breezer_wind_charge_motion_down>";asop=true;sourceisorigin=true;astarget=true} @self ~onSpawn
  - remove{delay=2} @self ~onSpawn
blizzard_display:
  Type: block_display
  DisplayOptions:
    Block: ice
    Scale: 1,2,1
    Translation: -0.5,-1.81,-0.5
  Skills:
  - remove{delay=82} @self ~onSpawnorload 
  - mounttarget @owner ~onSpawnorload 
  - mounttarget @owner ~onTimer:1