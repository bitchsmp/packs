alternate_crossbow_projectile_hit:
  Skills:
  - damage{amount=14;damagecause=projectile;preventimmunity=true;poweraffectsdamage=false}
alternate_crossbow_projectile_hit_piercing1:
  Skills:
  - damage{amount=14;damagecause=projectile;preventimmunity=true;poweraffectsdamage=false;ignoreshield=true}
alternate_crossbow_projectile_hit_piercing2:
  Skills:
  - damage{amount=14;damagecause=projectile;preventimmunity=true;poweraffectsdamage=false;ignoreshield=true}
  - delay 1
  - endprojectile{}
