alternate_crossbow_projectile_tick:
  Skills:
  - particle{particle=electric_spark}
alternate_crossbow_projectile_start:
  Skills:
  - addVar{value=40;name=caster.alternate_crossbow_heat} @self
alternate_crossbow_projectile_overheat:
  Skills:
  - actionmessage{message="<#ff0000>OVERHEAT"} @self
alternate_crossbow_heat_tick:
  Conditions:
  Skills:
  - addVar{value=-7;name=caster.alternate_crossbow_heat} @self ?varrange{name=caster.alternate_crossbow_heat;value=>500}
  - addVar{value=-5;name=caster.alternate_crossbow_heat} @self ?varrange{name=caster.alternate_crossbow_heat;value=>400} ?varrange{name=caster.alternate_crossbow_heat;value=<501}
  - addVar{value=-3;name=caster.alternate_crossbow_heat} @self ?varrange{name=caster.alternate_crossbow_heat;value=>300} ?varrange{name=caster.alternate_crossbow_heat;value=<401}
  - addVar{value=-2;name=caster.alternate_crossbow_heat} @self ?varrange{name=caster.alternate_crossbow_heat;value=<301} ?varrange{name=caster.alternate_crossbow_heat;value=>20}