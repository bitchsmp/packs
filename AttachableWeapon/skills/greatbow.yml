greatbow_Checkcondition:
  TargetConditions:
  - mmType{types=GreatBow_marker} true
  - fieldOfView{angle=30} orelsecast greatbow_Failedcondition 
  Skills:
  - aura{aura=looking_up_30degree;ticks=20} @self
greatbow_Failedcondition:
  Skills:
  - removeaura{aura=looking_up_30degree} @self

greatbow_arrow_rain:
  Skills:
  - sound{sound=entity.blaze.shoot}
  - delay 10
  - projectile{bulletType=DISPLAY;material=AIR;sfo=0.5;tickinterpolation=2;velocity=256;syo=1.62;maxrange=128;poweraffectsvelocity=false;onhitskill=greatbow_arrow_rain_tag_projectile_hit;drawhitbox=false;hr=3;vr=3;hnp=true;ontickskill=;highAccuracyMode=true;stopatblock=false;stopatentity=true;deathdelay=0} @Forward{yOffset=1.62}

greatbow_arrow_rain_arrow_hit:
  Skills:
  - damage{amount=16;preventimmunity=true}


greatbow_arrow_rain_tag_projectile_hit:
  Skills:
