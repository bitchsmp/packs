greatbow_Checkcondition:
  TargetConditions:
  - mmType{types=GreatBow_marker} true
  - fieldOfView{angle=30} orelsecast greatbow_Failedcondition 
  Skills:
  - aura{aura=looking_up_30degree;ticks=20} @self
greatbow_Failedcondition:
  Skills:
  - removeaura{aura=looking_up_30degree} @self

greatbow_arrow_rain:
  Skills:
  - potion{type=NIGHT_VISION;duration=10} @self
  - sound{sound=entity.blaze.shoot}
  - projectile{sfo=0.1;tickinterpolation=0;velocity=32;tickinterpolation=1;syo=1.62;maxrange=16;poweraffectsvelocity=false;drawhitbox=false;hr=0;vr=0;ontickskill=greatbow_arrow_rain_fx_projectile_tick;stopatblock=false;stopatentity=false;deathdelay=0} @Forward{yOffset=1.62}
  - delay 10
  # Target tagging projectile:
  - projectile{sfo=0.5;tickinterpolation=2;velocity=256;syo=1.62;maxrange=128;poweraffectsvelocity=false;onhitskill=greatbow_arrow_rain_tag_projectile_hit;drawhitbox=false;hr=3;vr=3;hnp=true;ontickskill=;highAccuracyMode=true;stopatblock=false;stopatentity=false;deathdelay=0} @Forward{yOffset=1.62}
greatbow_arrow_rain_fx_projectile_tick:
  Skills:
  - particle{color=#f700ff;material=reddust}

greatbow_arrow_rain_tag_projectile_hit:
  Skills:
  - potion{type=GLOWING;duration=20}
  - skill{s=greatbow_arrow_rain_function;repeat=12;repeatinterval=2}
  - delay 2
  - endprojectile{}
