chocolate_milk:
  Id: paper
  Display: Chocolate Milk
  Consumable:
    Animation: DRINK
    HasParticles: false
    Sound: entity.generic.drink
  Lore:
  - "<gray>Regular chocolate milk. Safe to drink."
  - "<gray>Totally not made from nitroglycerine."
  Options:
    ItemModel: hbm:chocolate_milk
    StackSize: 1
  Skills:
  - explode{blockdamage=false;fire=false;yield=7;delay=1} @selfLocation ~onConsume 
  - damage{amount=99;damagecause=ENTITY_EXPLOSION;delay=1} @self ~onConsume 
  - particle{particle=smoke_large;amount=50;speed=0.3} @self ~onConsume 
  - particle{particle=campfire_signal_smoke;amount=50;speed=0.2} @self ~onConsume 


# delay=1 because delay=0 will cause the item to not be consumed before the player drops the item dies of the skill mechanic 

