tome_of_darkness:
  Material: ECHO_SHARD
  Display: '<yellow>Tome of Darkness'
  Options:
    FireResistant: true
    StackSize: 1
    ItemModel: carl:swift_sneak
    Glint: true
    MaxDurability: 8
    Repairable: false
  Lore:
  - <white>
  - <gray>Inflicts target with <#61c3cb>Darkness<gray> effect for 60 seconds by writing their name in the chat</gray>
  - <gray>No one can see that chat message</gray>
  Skills:
  - skill{s=tome_of_darkness_main} @self ~onTimer:1
tome_of_must_have_been_the_wind:
  Material: ECHO_SHARD
  Display: '<yellow>Tome of<italic> must have been the wind'
  Options:
    FireResistant: true
    StackSize: 1
    ItemModel: mythitorium:swift_sneak_1
    Glint: true
    MaxDurability: 32
  Lore:
  - <white>
  - "<gray>Right-click: Cast a mini <gradient:#61c3cb:#024050>sonic boom</gray>"
  - <gray>Consumes experience
  Skills:
  - skill{s=tome_of_must_have_been_the_wind_leftclick} @self ~onUse

  - skill{s=tome_of_must_have_been_the_wind_leftclick} @self ~onRightclick