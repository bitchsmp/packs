    StackSize: 1
    ItemModel: hbm:heart_piece
    FireResistant: true
  Lore:
  - "<gray>Infinite Usage"
  - "<white>"
  - "<dark_purple>When Applied:"
  - "<light_purple>+2.0 Health"
