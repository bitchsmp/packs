sabre:
  Material: IRON_SWORD
  Display: '<yellow>Sabre'
  Options:
    ItemModel: minecraft:sabre
    FireResistant: true
    Unbreakable: true

  Lore:
  - "<gray><italic>Grassland Domination</gray>"
  - <white>
  - "<gray>When in Plains biome:"
  - "<blue>+3 Attack Damage"
  - "<white>"
  - "<gray>When on mounts:"
  - "<blue>+3 Attack Damage"
  EquipSlot: MAINHAND
  Skills:
  - aura{forcesync=true;aura=sabre_plain_buff;duration=2;component=[
    - stat{stat=ATTACK_DAMAGE;val=3;type=ADDITIVE}
    ]} @self ~onTimer:1 ?biome{biome=plains}
  - aura{forcesync=true;aura=sabre_mount_buff;duration=2;component=[
    - stat{stat=ATTACK_DAMAGE;val=3;type=ADDITIVE}
    ]} @self ~onTimer:1 ?mounted
  - particle{particle=egg_crack;amount=3;hspread=0.5;vspread=1;yoffset=1} @self ~onTimer:20 ?biome{biome=plains}
  - particle{particle=egg_crack;amount=3;hspread=0.5;vspread=1;yo=1} @self ~onTimer:20 ?mounted

katana:
  Material: IRON_SWORD
  Display: '<yellow>Katana'
  UseCooldown:
    CooldownGroup: katana
    CooldownSeconds: 3
  Attributes:
    MainHand:
      ATTACK_DAMAGE: 6 ADD
      ATTACK_SPEED: -2.4 ADD
  Options:
    ItemModel: minecraft:katana
    FireResistant: true
    Unbreakable: true

  Lore:
  - "<gray>Right-click: Lunges forward</gray>"
  EquipSlot: MAINHAND
  Skills:
  - skill{s=[
    - sound{sound=item.spear.lunge_3}
    - lunge{velocity=2;velocityY=0} @forward{forward=16}
    - swingarm{}
    - setItemGroupCooldown{key=katana;ticks=60}
    ]} @Self ~onUse ?!itemGroupOnCooldown{group=katana} ?!crouching 
