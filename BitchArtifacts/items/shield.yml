shield_infusion:
  Id: paper
  Display: Shield Infusion
  Consumable:
    Animation: DRINK
    HasParticles: false
    Sound: entity.generic.drink
  Lore:
  - "<blue>Shield Infused (1:20:00)"
  - "<white>"
  - "<dark_purple>When Applied:"
  - "<gold>+10.0 shield"
  - "<yellow>Regenerates every 120 seconds."
  Options:
    ItemModel: hbm:flask_shield
  Skills:
  - aura{aura=shield_infused;ticks=120000;showbartimer=true;bartimerdisplay="Super Effect:<yellow> Shield Infused";bartimercolor=YELLOW;cancelonteleport=false;cancelonchangeworld=false;cancelonquit=false;onstartskill=[
    - potion{type=ABSORPTION;level=4;duration=2400}
    - sound{sound=block.bell.resonate;pitch=2.0}
    ];interval=2400;ontickskill=[
    - potion{type=ABSORPTION;level=4;duration=2400} @self
    - sound{sound=block.bell.resonate;pitch=2.0}
    ]} @self ~onConsume
  UseRemainder: glass_bottle
