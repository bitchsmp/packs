toxic_soapy_water:
  Id: paper
  Display: "Toxic Soapy Water"
  Consumable:
    Animation: DRINK
    Sound: item.honey_bottle.drink
    ConsumeSeconds: 3
  Options:
    StackSize: 1
    FireResistant: true
    ItemModel: hbm:bathwater
  Lore:
  - "<blue>Toxic (8:00)"
  - "<white>"
  - "<dark_purple>When Applied:"
  - "<light_purple>Inflicts poison on the attacker"
  Skills:
  - ondamaged{aura=toxic;ondamagedskill=[
    - potion{type=POISON;duration=100;level=1} @trigger
