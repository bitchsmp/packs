spider_milk:
  Id: paper
  Display: "Spider Milk"
  Lore:
  - "Remove all Super Effects"
  Consumable:
    Animation: DRINK
    Sound: entity.generic.drink
    HasParticles: false


  Options:
    StackSize: 1
    FireResistant: true
    ItemModel: hbm:spider_milk
  Skills:
  - removeaura{aura=toxic} @self ~onConsume
  - removeaura{aura=v1} @self ~onConsume
  UseRemainder: glass_bottle