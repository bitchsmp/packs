spider_milk:
  Id: paper
  Display: "Spider Milk"
  Lore:
  - "<gray>Remove all Super Effects"
  Consumable:
    Animation: DRINK
    Sound: entity.generic.drink
    HasParticles: false


  Options:
    StackSize: 1
    FireResistant: true
    ItemModel: hbm:spider_milk
  Skills:
  - removeaura{aura=toxic} @self ~onConsume
  - removeaura{aura=v1} @self ~onConsume
  - removeaura{aura=shield_infused} @self ~onConsume
  - removeaura{aura=regenerative_wax} @self ~onConsume
  UseRemainder: glass_bottle
  Recipes:
    SHAPELESS:
      Type: SHAPELESS
      Amount: 1
      IngredientsLeftover:
      - bucket
      Ingredients:
      - milk_bucket
      - glass_bottle
      - fermented_spider_eye
