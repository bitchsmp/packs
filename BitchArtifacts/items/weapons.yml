terrablade:
  Material: diamond_sword
  Display: '<yellow>Terrablade'
  Options:
    ItemModel: minecraft:terrablade
  Lore:
  - "<gray>Each swing fires a wave of energy"
  - <gray><italic>Terrarians love this thing</gray>

  Skills:
  - skill{s=terrablade_projectile_leftclick} ~onSwing 




brimstone_claymore:
# Original name from Blade of Majestica rspack: Brimstone_Claymore
  Material: iron_sword
  Display: 'Brimstone Claymore'
  Options:
    ItemModel: minecraft:brimstone_claymore
  Lore:
  - "<gray>Causes an extra unextinguishable and unblockable burning effect to the target"
  - "<gray>To increase damage, upgrade to<aqua> Diamond</aqua> using <white>Crafting Table"
  Skills:
  - aura{aura=UltraBurn;duration=200;interval=20;ontickskill=[
    - damage{a=0.5;preventknockback=true}
    - effect:particles{particle=flame;amount=50;hS=0.1;vS=0.1;speed=0.3}
    - ignite{ticks=200}
    ]} @trigger ~onAttack ?!itemRecharging{}
  - sound{sound=ultrakill:firestart;volume=0.6} @self ~onAttack ?!itemRecharging{}

brimstone_claymore_diamond:
  Id: diamond_sword
  Display: 'Brimstone Claymore'
  Options:
    ItemModel: minecraft:brimstone_claymore
  Lore:
  - "<gray>Causes an extra unextinguishable and unblockable burning effect to the target"
  - "<gray>To increase damage, upgrade to</gray><gradient:#31292a:#837f7f> Netherite<gray> using <white>Smithing Table</white> and<yellow> Netherite Upgrade"
  Skills:
  - aura{aura=UltraBurn;duration=200;interval=20;ontickskill=[
    - damage{a=0.5;preventknockback=true}
    - effect:particles{particle=flame;amount=50;hS=0.1;vS=0.1;speed=0.3}
    - ignite{ticks=200}
    ]} @trigger ~onAttack ?!itemRecharging{}
  - sound{sound=ultrakill:firestart;volume=0.6} @self ~onAttack ?!itemRecharging{}
  Recipes:
    SHAPED:
      Type: SHAPED
      Amount: 1
      Ingredients:
      - air | diamond | air
      - air | diamond | air
      - diamond | brimstone_claymore | diamond
alternate_crossbow:
  Material: crossbow
  Display: '<white>Alternate Crossbow'
  Options:
    ItemModel: dueris:alternate_crossbow
  Lore:
  - <gray>Turns shooted projectile into hitscans</gray>

  Skills:
  - variableSet{value=20;type=INTEGER;name=caster.alternate_crossbow_heat} ~onTimer:1 @self ?!varset{name=caster.alternate_crossbow_heat}
  - aura{aura=alternate_crossbow_heat_aura;ticks=600;interval=10;ontickskill=alternate_crossbow_heat_tick} @self ~onTimer:1
  - skill{skill=alternate_crossbow_onShoot} ~onShoot @Self
  - cancelEvent ~onShoot

  - skill{skill=[
    - actionmessage{message="<#ff0000><caster.var.alternate_crossbow_heat> °C"} ?varrange{name=caster.alternate_crossbow_heat;value=>600}
    - actionmessage{message="<red><caster.var.alternate_crossbow_heat> °C"} @self ?varrange{name=caster.alternate_crossbow_heat;value=>500} ?varrange{name=caster.alternate_crossbow_heat;value=<601}
    - actionmessage{message="<gold><caster.var.alternate_crossbow_heat> °C"} @self ?varrange{name=caster.alternate_crossbow_heat;value=>400} ?varrange{name=caster.alternate_crossbow_heat;value=<501}
    - actionmessage{message="<yellow><caster.var.alternate_crossbow_heat> °C"} @self ?varrange{name=caster.alternate_crossbow_heat;value=>300} ?varrange{name=caster.alternate_crossbow_heat;value=<401}
    - actionmessage{message="<white><caster.var.alternate_crossbow_heat> °C"} @self ?varrange{name=caster.alternate_crossbow_heat;value=<301} 
    ]} ~onTimer:10 @self


#Pls nerf
creation_splitter:
  Material: netherite_sword
  Display: '<red>Creation Splitter'
  Options:
    ItemModel: minecraft:creationsplitter
  EquipSlot: hand
  Lore:
  - <gray>Strip your target armor</gray>
  - <white>
  - "<light_purple>Attacks reduce 20 armor point of the target; effect lasts for 10 seconds"
  - "<red>⚠Missing a swing disables the weapon for 2 seconds"

  Skills:
  - stataura{forcesync=true;stat=ARMOR;val=-20;type=ADDITIVE;aura=CREATIONSPLITTER_ARMOR_STRIPPER;duration=200;delay=1} @trigger ~onAttack ?!hasAura{aura=CREATIONSPLITTER_ATTACK_FAILED}
  - aura{aura=CREATIONSPLITTER_ATTACK_SUCCESS;ticks=2} @self ~onAttack
  - aura{aura=CREATIONSPLITTER_ATTACK_FAILED;delay=1;ticks=40;onstartskill=CREATIONSPLITTER_ATTACK_FAILED_FX;ontickskill=CREATIONSPLITTER_ATTACK_FAILED_FX_TICK} @self ~onSwing ?!hasAura{aura=CREATIONSPLITTER_ATTACK_SUCCESS} ?!hasAura{aura=CREATIONSPLITTER_ATTACK_FAILED}
  - aura{aura=CREATIONSPLITTER_ATTACK_DISABLE;ticks=2} @self ~onTimer:1 ?hasAura{aura=CREATIONSPLITTER_ATTACK_FAILED}

  - aura{aura=CREATIONSPLITTER_ATTACK_DISABLE_END2TICK_EARLY;ticks=2} @self ~onTimer:1 ?hasAura{aura=CREATIONSPLITTER_ATTACK_FAILED_END2TICK_EARLY}
  - cancelEvent ~onSwing ?hasAura{aura=CREATIONSPLITTER_ATTACK_DISABLE}
  - cancelEvent ~onAttack ?hasAura{aura=CREATIONSPLITTER_ATTACK_DISABLE}
  - potion{type=HASTE;level=99;hasparticles=false;hasicon=false;overwrite=true;duration=2} @self ~onTimer:1 ?hasAura{aura=CREATIONSPLITTER_ATTACK_DISABLE_END2TICK_EARLY}
  - potion{type=MINING_FATIGUE;level=99;hasparticles=false;hasicon=false;overwrite=true;duration=2} @self ~onTimer:1 ?hasAura{aura=CREATIONSPLITTER_ATTACK_DISABLE_END2TICK_EARLY}