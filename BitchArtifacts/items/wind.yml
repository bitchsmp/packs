infinite_gust:
  UseCooldown:
    CooldownGroup: wind_charge
  Id: fishing_rod
  Display: "<yellow>Infinite Gust"
  Lore:
  - "<gray>Right-click:"
  - "<gray>Summons a breeze wind charge at the leg and launches downward"
  - "<gray>Wind charge velocity is constant and absolute"
  Options:
    Glint: true
    StackSize: 1
    Repairable: false
    Unbreakable: true
    HideFlags: true
  Skills:
  - cancelEvent ~onFish
  - skill{s=infinite_gust} @sel ~onFish

