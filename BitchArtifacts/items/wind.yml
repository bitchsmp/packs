infinite_gust:
  Id: wind_charge
  Display: "<yellow>Infinite Gust"
  Lore:
  - ""
  - "<gray>Summon a breeze wind charge at the leg and launches downward"
  - "<gray>Wind charge velocity is constant and absolute"
  Options:
    Glint: true
    StackSize: 1
  Skills:
  - cancelEvent ~onUse
  - cancelEvent ~onRightclick 
  - skill{s=infinite_gust} @self ~onUse
  - skill{s=infinite_gust} @self ~onRightclick 
gale:
  Material: breeze_rod
  Display: "Gale"
  UseCooldown:
    CooldownGroup: gale
  Options:
    MaxDurability: 32
    ItemModel: minecraft:breeze_rod
    Glint: true
    StackSize: 1

  Lore:
  - <white>
  - <gray>Right-click: Grants you faster movement speed</gray>
  - <white>
  Skills:
  - swingarm{} ~onUse ?!itemGroupOnCooldown{group=gale} false
  - swingOffhand ~onRightclick ?!itemGroupOnCooldown{group=gale} false
  - skill{s=gale} @self ~onUse ?!itemGroupOnCooldown{group=gale} false
  - skill{s=gale} @self ~onRightclick ?!itemGroupOnCooldown{group=gale} false
