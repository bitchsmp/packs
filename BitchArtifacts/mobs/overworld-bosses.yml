

ZombieCommanderHussar:
  Type: ZOMBIE
  Display: '&6Zombie Hussar Commander'
  Health: 360
  Faction: zombie_hussar
  Damage: 5

  Skills:
  - remove @child ~onDeath
  - potion{type=FIRE_RESISTANCE;duration=2147483647;hasparticles=false} @self ~onSpawnorload 
  - skill{skill=[
    - modifyDamage{amount=-0.87;action=ADDITIVE_MULTIPLIER}
    - delay 40
    - skill{skill=DashAttack}
    ]} ~onDamaged ?DamageAmount{damageamount=>99}
  #
  - skill{skill=[
    - modifyDamage{amount=-0.911;action=ADDITIVE_MULTIPLIER}
    - delay 35
    - skill{skill=DashAttack}
    ]} ~onDamaged ?DamageAmount{damageamount=>199}
  
  - attribute{attribute=STEP_HEIGHT;amount=69} @self ~onSpawnorload
  - heal{amount=100;overheal=false} @self ~onTimer:50 ?!playerInRadius{radius=64;a=>0}
  - remove @child ~onTimer:50 ?!playerInRadius{radius=64;a=>0}

  - particle{particle=egg_crack;amount=3;hspread=0.5;vspread=1;yoffset=1} @self ~onTimer:20 ?biome{biome=plains}
  #
  - skill{skill=SummonZombie;cooldown=30} ~onDamaged @selfLocation <50%
  #
  - skill{skill=DashAttack} ~onCombat @target 0.2
  - skill{skill=SummonZombie} ~onCombat @selfLocation <50% 0.01
  #
  - skill{skill=DashAttack} ~onDamaged @target 0.8 ?DamageAmount{damageamount=>50}
  - skill{skill=SummonZombie} ~onDamaged @selfLocation <50% 0.3 ?DamageAmount{damageamount=>50}
  #
  - skill{skill=DashAttack} ~onTimer:20 @target 0.2
  - skill{skill=SummonZombie} ~onTimer:20 @selfLocation <50% 0.01
  Equipment:
  - NETHERITE_HELMET HEAD
  - NETHERITE_BOOTS FEET
  - sabre MAINHAND
  Drops:
  - sabre 1 1
  - weapon_steel_ingot 1 1

  Options:
    AlwaysShowName: true
    MovementSpeed: 0.31
    MaxCombatDistance: 16
    PreventOtherDrops: true
    FollowRange: 64
    PreventRandomEquipment: true
    PreventConversion: true
    PreventRenaming: true
    Despawn: NEVER
    PreventSunburn: true
    PreventTransformation: true
    Glowing: true
    DigOutOfGround: true
  BossBar:
    Enabled: true
    Title: "&6Zombie Hussar Commander"
    Range: 64
    Color: GREEN
    Style: SEGMENTED_6
    CreateFog: true
    DarkenSky: true

ZombieHussarMinion:
  Type: ZOMBIE
  Mount: ZombieHussarHorse
  Display: '&2Zombie Hussar'
  Health: 10
  Faction: zombie_hussar

  Equipment:
  - DIAMOND_HELMET HEAD
  - IRON_SPEAR MAINHAND
  Damage: 5
  Options:
    AlwaysShowName: true
    MovementSpeed: 0.295
    PreventOtherDrops: true
    FollowRange: 64
    PreventRandomEquipment: true
    PreventConversion: true
    PreventRenaming: true
    PreventSunburn: true
    PreventTransformation: true
  Skills:
  - remove @child ~onDeath
  - remove{delay=400} @self ~onSpawnorload 
  - mounttarget @child ~onTimer:1 ?!mounted{}
ZombieHussarHorse:
  Type: ZOMBIE_HORSE
  Health: 10
  Faction: zombie_hussar
  Options:
    AlwaysShowName: true
    MovementSpeed: 0.295
    PreventOtherDrops: true
    FollowRange: 64
    PreventRandomEquipment: true
    PreventConversion: true
    PreventRenaming: true
    PreventSunburn: true
    PreventTransformation: true
    #
    PassthroughDamage: true
  Skills:
  - remove @self ~onTimer:1 ?!isParentAlive
