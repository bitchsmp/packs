

ZombieSamurai:
  Type: ZOMBIE
  Display: '&6Zombie Samurai'
  Health: 200
  Faction: zombie_samurai
  Damage: 2

  Skills:
  - remove @child ~onDeath
  - potion{type=FIRE_RESISTANCE;duration=2147483647;hasparticles=false} @self ~onSpawnorload
  - equip{items=katana HAND} @self ~onTimer:20 >50%
  - equip{items=wakizashi HAND} @self ~onTimer:20 >50%
  - equip{items=mace HAND} @self ~onTimer:1 ?hasaura{aura=smash} <50%
  - equip{items=katana OFFHAND} @self ~onTimer:1 ?hasaura{aura=smash} <50%
  - heal{amount=50} @self ~onAttack
  #First phase
  - skill{s=samurai_dash} @target ~onCombat 0.5 >50%
  - skill{s=samurai_dash_wakizashi} ~onCombat 0.4 >50%
  - skill{s=samurai_dash} @target ~onTimer:20 0.2 >50%
  #Second phase
  # - skill{skill=samurai_dashhell} ~
  - skill{s=samurai_mace} @target ~onTimer:60 <50%
  - skill{s=samurai_dashhell_ez} @pir{radius=50} ~onTimer:40 <25%
  - skill{s=samurai_mace} @target ~onSignal:go
  - cancelEvent ~onDamaged ?DamageCause{damagecause=FALL}



  
  - message{m="<bold><gold>Zombie Samurai has been defeated"} @server ~onDeath 
  Equipment:
  - NETHERITE_HELMET HEAD
  - NETHERITE_CHESTPLATE CHEST
  - NETHERITE_LEGGINGS LEGS
  - NETHERITE_BOOTS FEET
  - katana MAINHAND
  - wakizashi OFFHAND
  Drops:
  - katana 1 1
  - wakizashi 1 1
  - weapon_steel_ingot 2 1
  - katana_blueprints 1 1
  - wakizashi_blueprints 1 1
  - ENCHANTED_GOLDEN_APPLE 5 1

  Options:
    AlwaysShowName: true
    MovementSpeed: 0.27
    MaxCombatDistance: 16
    PreventOtherDrops: true
    FollowRange: 64
    PreventRandomEquipment: true
    PreventConversion: true
    PreventRenaming: true
    Despawn: NEVER
    PreventSunburn: true
    PreventTransformation: true
    Glowing: true
    DigOutOfGround: true
  BossBar:
    Enabled: true
    Title: "&6Zombie Samurai"
    Range: 64
    Color: GOLD
    Style: SEGMENTED_6

ZombieSamuraiDashMarkers:
  Type: ARMOR_STAND
  Display: '&6Zombie Samurai'
  Faction: zombie_samurai
  Options:
    VisibleByDefault: false
  #
    NoAI: true
    Silent: true
    CanMove: false
    Marker: true
    HasGravity: false
    Invincible: true
    Interactable: false
    PreventOtherDrops: true
    PreventRandomEquipment: true
    PreventConversion: true
    PreventRenaming: true
    PreventSunburn: true
    PreventTransformation: true
  Skills:
  - remove{delay=21} @self ~onSpawnorload
  - particle{particle=end_rod;yoffset=1;a=15;speed=1;delay=16} @self ~onSpawnorload
  - particle{particle=end_rod;yoffset=1;a=1} @self ~onSpawnorload
  - sound{sound=entity.generic.explode;pitch=1.67;volume=0.35;delay=16}  @self ~onSpawnorload
  - damage{amount=40;delay=16;ignoreshield=true} @EIR{radius=1.5;targetsamefaction=false} ~onSpawnorload
ZombieSamuraiDashMarkersQuiet:
  Template: ZombieSamuraiDashMarkers
  Exclude:
  - Skills
  Skills:
  - remove{delay=26} @self ~onSpawnorload
  - particle{particle=end_rod;yoffset=1;a=2;speed=1;delay=21} @self ~onSpawnorload
  - particle{particle=end_rod;yoffset=1;a=1} @self ~onSpawnorload
  - sound{sound=entity.generic.explode;pitch=1.67;volume=0.05;delay=21}  @self ~onSpawnorload
  - damage{amount=40;delay=21;ignoreshield=true} @EIR{radius=0.95;targetsamefaction=false} ~onSpawnorload