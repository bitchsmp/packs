

ZombieSamurai:
  Type: ZOMBIE
  Display: '&6Zombie Samurai'
  Health: 500
  Faction: zombie_samurai
  Damage: 1
  AIGoalSelectors:
  - clear
  - meleeAttack{followUnseen=true}
  - float
  

  Skills:
  - dismount ~onTimer:20
  - remove @child ~onDeath
  - potion{type=FIRE_RESISTANCE;duration=2147483647;hasparticles=false} @self ~onSpawnorload
  - skill{skill=[
    - modifyDamage{amount=-0.5;action=ADDITIVE_MULTIPLIER}
    - delay 40
    - skill{s=samurai_dashhell}
    ]} ~onDamaged ?DamageAmount{damageamount=>35}
  - skill{skill=[
    - modifyDamage{amount=-0.95;action=ADDITIVE_MULTIPLIER}
    - delay 40
    - skill{s=samurai_dashhell}
    ]} ~onDamaged ?DamageAmount{damageamount=>99}
  - skill{skill=[
    - modifyDamage{amount=-0.999;action=ADDITIVE_MULTIPLIER}
    - delay 35
    - skill{s=samurai_dashhell}
    ]} ~onDamaged ?DamageAmount{damageamount=>199}
  - attribute{attribute=STEP_HEIGHT;amount=69} @self ~onSpawnorload
  - heal{amount=25;overheal=false} @self ~onTimer:50 ?!playerInRadius{radius=64;a=>0}
  # always
  - skill{s=samurai_dash} @target ~onTimer:20 0.2
  - skill{s=samurai_dash} @target ~onCombat 0.5
  #First phase
  - skill{s=samurai_dash_wakizashi} ~onCombat 0.4 >50%
  #Second phase
  - skill{s=samurai_dashhell_ez;repeat=5;repeatinterval=2} @PIR{radius=50;limit=5} ~onTimer:40 <25%
  - cancelEvent ~onDamaged ?DamageCause{damagecause=FALL}
  - command{command="execute at <caster.uuid> run function dueris:wakizashi";asop=true} @self ~onDeath
  - command{command="execute at <caster.uuid> run function dueris:katana";asop=true} @self ~onDeath


  
  - message{m="<bold><gold>Zombie Samurai has been defeated"} @server ~onDeath 
  Equipment:
  - NETHERITE_HELMET HEAD
  - NETHERITE_CHESTPLATE CHEST
  - NETHERITE_LEGGINGS LEGS
  - NETHERITE_BOOTS FEET
  - katana MAINHAND
  - wakizashi OFFHAND
  Drops:
  - weapon_steel_ingot 3-8 1
  - katana_blueprints 1 1
  - wakizashi_blueprints 1 1
  - ENCHANTED_GOLDEN_APPLE 5-15 1
  - music_disc_wemmbu_thinking_emoji_rival 1 1

  Options:
    AlwaysShowName: true
    MovementSpeed: 0.27
    MaxCombatDistance: 32
    PreventOtherDrops: true
    FollowRange: 64
    PreventRandomEquipment: true
    PreventConversion: true
    PreventRenaming: true
    Despawn: NEVER
    PreventSunburn: true
    PreventTransformation: true
    Glowing: true
    DigOutOfGround: true
  BossBar:
    Enabled: true
    Title: "&6Zombie Samurai"
    Range: 64
    Color: GOLD
    Style: SEGMENTED_6

ZombieSamuraiDashMarkers:
  Type: ARMOR_STAND
  Display: '&6Zombie Samurai'
  Faction: zombie_samurai
  Options:
    VisibleByDefault: false
  #
    NoAI: true
    Silent: true
    CanMove: false
    Marker: true
    HasGravity: false
    Invincible: true
    Interactable: false
    PreventOtherDrops: true
    PreventRandomEquipment: true
    PreventConversion: true
    PreventRenaming: true
    PreventSunburn: true
    PreventTransformation: true
  Skills:
  - heal{a=10} @parent ~onHit
  - remove{delay=21} @self ~onSpawnorload
  - particle{particle=end_rod;yoffset=1;a=15;speed=0.2;delay=16} @self ~onSpawnorload
  - sound{sound=entity.generic.explode;pitch=1.67;volume=0.35;delay=16}  @self ~onSpawnorload
  - damage{amount=40;delay=16;ignoreshield=true;triggerskills=true} @EIR{radius=1.5;targetsamefaction=false} ~onSpawnorload
ZombieSamuraiDashMarkersQuiet:
  Template: ZombieSamuraiDashMarkers
  Exclude:
  - Skills
  Skills:
  - heal{a=10} @parent ~onHit
  - remove{delay=31} @self ~onSpawnorload
  - particle{particle=wax_off;yoffset=0.95;a=1;speed=0} @self ~onSpawnorload
  - particle{particle=end_rod;yoffset=1;a=1;delay=26} @self ~onSpawnorload
  - sound{sound=entity.generic.explode;pitch=1.67;volume=0.05;delay=26}  @self ~onSpawnorload
  - damage{amount=40;delay=26;ignoreshield=true;triggerskills=true} @EIR{radius=0.95;targetsamefaction=false} ~onSpawnorload