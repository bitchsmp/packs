tome_of_must_have_been_the_wind_projectile_hit:
  Skills:
  - damage{amount=18;preventimmunity=true;delay=6}
tome_of_must_have_been_the_wind_projectile_tick:
  Skills:
  - particle{particle=sonic_boom}
tome_of_must_have_been_the_wind_leftclick:
  Cooldown: 1
  Conditions:
  - EnchantingLevel{l=>0} orelsecast tome_of_must_have_been_the_wind_noxp
  - crouching false
  Skills:
  - projectile{bulletType=DISPLAY;material=AIR;sfo=0.1;tickinterpolation=2;velocity=128;syo=1.62;maxrange=24;poweraffectsvelocity=false;onhitskill=tome_of_must_have_been_the_wind_projectile_hit;drawhitbox=false;stopatentity=false;hr=0.7;vr=0.7;hnp=true;ontickskill=tome_of_must_have_been_the_wind_projectile_tick;highAccuracyMode=true;stopatblock=false} @Forward{yOffset=1.62}
  - sound{sound=entity.warden.sonic_boom;delay=5;volume=0.6;radius=16}
  - command{command="xp add <caster.name> -6 points";asop=true}
tome_of_must_have_been_the_wind_noxp:
  Skills:
  - actionmessage{message=Not enough XP}