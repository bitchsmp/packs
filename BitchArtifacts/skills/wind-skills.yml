infinite_gust:
  Conditions:
  - materialIsOnCooldown{material=wind_charge} false
  Skills:
  - setVar{type=STRING;value="{Motion:[0d,-1d,0d]}";name=global.infinite_gust_wind_charge_motion_down} 
  - command{command="summon minecraft:breeze_wind_charge ~ ~ ~ <global.var.infinite_gust_wind_charge_motion_down>";asop=true;sourceisorigin=true;astarget=true} @self
  - setMaterialCooldown{material=wind_charge;duration=60}
wind_in_a_bottle:
  Conditions:
  - materialIsOnCooldown{material=wind_charge} false
  Skills:
  - setVar{type=STRING;value="{Motion:[0d,-1.488936d,0d]}";name=global.wind_in_a_bottle_motion}
  - command{command="summon minecraft:wind_charge ~ ~ ~ <global.var.wind_in_a_bottle_motion>";asop=true;sourceisorigin=true;astarget=true}
  - setMaterialCooldown{material=wind_charge;duration=80}
gale:
  Conditions:
  Skills:
  - aura{forcesync=true;duration=60;interval=2;ontickskill=[
    - particle{particle=small_gust;vspread=0.7;hspread=0.3;a=1;yoffset=0.5}
    ];onstartskill=[
    - particle{particle=gust;a=1;yoffset=1}
    - sound{sound=entity.breeze.wind_burst;volume=0.8;pitch=0.8}
    ];aura=gale_speed_buff;components=[
    - stat{stat=MOVEMENT_SPEED;type=ADDITIVE;value=0.1}
    ]}
  - setItemGroupCooldown{key=gale;ticks=100}
  - consumeuseddurability{amount=1}
ventose:
  Conditions:
  - HasItem{amount=>1;strict=true;types=wind_charge} orelsecast ventose_no_wind_charge
  - itemGroupOnCooldown{group=ventose} false
  Skills:
  - command{command="clear <caster.name> minecraft:wind_charge[minecraft:max_stack_size=64] 2";asop=true;ascaster=true}
  - setVar{type=STRING;value="{Motion:[0d,-1.488936d,0d]}";name=global.ventose_wind_charge_motion}
  - skill{s=ventose_orbital_projectile}
  - setItemGroupCooldown{key=minecraft:ventose;ticks=100}
  - delay 20
  - command{command="summon minecraft:wind_charge <caster.l.x> <caster.l.y> <caster.l.z> <global.var.ventose_wind_charge_motion>";repeat=3;asop=true;sourceisorigin=true}
ventose_no_wind_charge:
  Skills:
  - actionmessage{message="<red>You've ran out of wind charges"}
ventose_orbital_projectile:
  Skills:
  - orbital{radius=4;ticks=20;hitnonplayers=false;hitplayers=false;points=32;ontickskill=ventose_orbital_projectile_tick;onstartskill=ventose_orbital_projectile_onstart}
  - orbital{radius=4;ticks=20;hitnonplayers=false;hitplayers=false;points=32;ontickskill=ventose_orbital_projectile_tick;onstartskill=ventose_orbital_projectile_onstart;startingPoint=16}
  - orbital{radius=4;ticks=20;hitnonplayers=false;hitplayers=false;points=32;ontickskill=ventose_orbital_projectile_tick;onstartskill=ventose_orbital_projectile_onstart;startingPoint=8}
  - orbital{radius=4;ticks=20;hitnonplayers=false;hitplayers=false;points=32;ontickskill=ventose_orbital_projectile_tick;onstartskill=ventose_orbital_projectile_onstart;startingPoint=24}
ventose_orbital_projectile_onstart:
  Skills:
  - modifyprojectile{trait=RADIUS;value=-0.2;action=ADD;repeat=19;repeatinterval=1}
ventose_orbital_projectile_tick:
  Skills:
  - particle{particle=cloud;amount=1;y=0.5} @origin
