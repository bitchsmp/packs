
DashAttack:
  Cooldown: 4
  Conditions:
  - targetwithin{d=25}
  Skills:
  - setskillcd{skill=DashAttack;seconds=2} ?biome{biome=plains}
  - message{cooldown=30;m="<mob.name><&co> Hahahah! I will crush you, fool!"} @PlayersInRadius{r=64}
  - effect:sound{s=ultrakill:blueflash;volume=1.0;pitch=1;radius=32;audience=world} @PlayersInRadius{r=32}
  - particle{particle=soul_fire_flame;yoffset=3;amount=10;speed=0.05} @selfLocation
  - delay 8
  - delay 8 ?healthpercent{percent=<50%}
  - sudoskill{target=@self;skill=[
    - teleportto{target=@forward{forward=1;yoffset=1}}
    ]} @target
  - delay 5
  - damage{amount=40;ignorearmor=true} @EIR{r=6;targetsamefaction=false} ?healthpercent{percent=>50%}
  - damage{amount=32;ignorearmor=true} @EIR{r=6;targetsamefaction=false} ?healthpercent{percent=<50%}
  - throw{velocity=10;velocityY=5} @EIR{r=6;targetsamefaction=false}
  - effect:explosion @Self


