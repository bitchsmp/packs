samurai_dash:
  Cooldown: 4
  Conditions:
  - targetwithin{d=25}
  - playerInRadius{radius=100;amount=>2}
  Skills:
  - skill{skill=samurai_dashhell} =25%-75%
  - stun{stopai=true;gravity=false;ticks=4} @self
  - effect:sound{s=ultrakill:blueflash;volume=1.0;pitch=1;radius=64;audience=nearby} @selfLocation
  - delay 5
  - projectile{hp=false;hnp=false;verticalradius=0.1;tickinterpolation=5;horizontalradius=0.1;stopatentity=false;stopatblock=true;maxrange=16;velocity=120;drawhitbox=false
    ;onendskill=[
    - sound{sound=minecraft:item.spear.lunge_3} @self
    - teleportto{target=@origin{yoffset=1}} @self

    - stun{stopai=true;gravity=false;ticks=20} @self
    - particle{particle=wax_off;yoffset=1;a=1}
    - summon{a=1;type=ZombieSamuraiDashMarkers}
    ];ontickskill=[
    - particle{particle=wax_off;yoffset=1;a=1}
    - summon{a=1;type=ZombieSamuraiDashMarkers}
    ]} @target
samurai_dash_wakizashi:
  Cooldown: 1
  Conditions:
  - skillOnCooldown{skill=samurai_dash}
  - playerInRadius{radius=100;amount=>2}
  - targetwithin{d=25} true
  Skills:
  - sound{sound=minecraft:item.spear.lunge_3} @self
  - teleport @forward{f=-6;yoffset=1}
