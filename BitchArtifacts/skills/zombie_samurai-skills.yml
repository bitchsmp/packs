  Cooldown: 1
  Conditions:
  - targetwithin{d=48}
  Skills:
  - skill{s=[
    - skill{s=samurai_dashhell_x}
    - skill{s=samurai_dashhell_z}
    - skill{s=samurai_dashhell_y}
    ]} ?chance{chance=0.5;onfailskill=[
      - skill{s=[
        - skill{s=samurai_dashhell_xz1}
        - skill{s=samurai_dashhell_xz2}
        - skill{s=samurai_dashhell_y}
        ]}]}
