bottle_of_adrenaline:
  Id: potion
  Display: Bottle Of Adrenaline
  Options:
    StackSize: 1
    Glint: true
    HideFlags: true
  Consumable:
    ConsumeSeconds: 2147483647
    HasParticles: false
    Animation: BLOCK
  Skills:
  - aura{aura=using_bottle_of_adrenaline;doendskillonterminate=false;ticks=10;onendskill=bottle_of_adrenaline_effect} @self{} ~onUse ?!itemGroupOnCooldown{group=bottle_of_adrenaline} ?equipslot{slot=HAND}
  - effect:sound{sound=entity.generic.drink} @self ~onTimer:4 ?hasAura{aura=using_bottle_of_adrenaline}
  - removeAura{aura=using_bottle_of_adrenaline} @self ~onStopusing
  UseCooldown:
    CooldownGroup: bottle_of_adrenaline
