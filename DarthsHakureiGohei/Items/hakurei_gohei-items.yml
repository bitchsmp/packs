hakurei_gohei:
  Id: STICK
  Attributes:
    MainHand:
      AttackSpeed: -3 ADD
  Display: <gold>Purification Rod</gold>
  Lore:
    - <gradient:#FE0000:#FEFEFE>Used for monster exterminating</gradient>
    - <white>
  Options:
    Repairable: false
    Unbreakable: true
    HideFlags: true
    PreventStacking: true
    ItemModel: touhou_little_maid:hakurei_gohei
  Skills:
# Variable Skill System
  - setvar{value=1;scope=caster;name=caster.hakureigohei;type=INTEGER} @self ~onUse ?!varset{name=caster.hakureigohei}
  - addVariable{value=1;name=caster.hakureigohei} ?varrange{name=caster.hakureigohei;value=<4} ~onUse @self ?crouching
  - setvar{value=1;scope=caster;name=caster.hakureigohei;type=INTEGER} ?varrange{name=caster.hakureigohei;value=>3} ~onUse ?crouching
  - skill{s=hakurei_gohei_skillChooseDisplay} ~onUse  @self ?crouching


  - skill{s=hakurei_gohei_skill1} @self ~onUse
  - skill{s=hakurei_gohei_skill3} @self ~onUse
  - skill{s=hakurei_gohei_skill2} @self ~onUse
  # - skill{s=hakurei_gohei_skill4} @self ~onUse

# Leftclick
  - skill{s=hakurei_gohei_leftclick} @trigger ~onAttack
  
  - cancelEvent ~onAttack
  
variable_stick:
  Id: STICK
  Display: <gold>Variable stick</gold>
  Options:
    Repairable: false
    Unbreakable: true
    HideFlags: true
    PreventStacking: true
  Skills:
  - setvar{value=1;scope=caster;name=caster.varstick;type=INTEGER} @self ~onhold
  - addVariable{value=1;name=caster.varstick} ?varrange{name=caster.varstick;value=<5} ~onUse
  - setvar{value=1;scope=caster;name=caster.varstick;type=INTEGER} ?varrange{name=caster.varstick;value=>4} ~onUse
  - message{message=<caster.var.varstick>} @self ~onUse
  