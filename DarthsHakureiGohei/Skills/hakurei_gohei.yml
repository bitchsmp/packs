hakurei_gohei_skillChooseDisplay:
  Skills:
  - actionmessage{message="<caster.var.hakureigohei>"}
  - message{message=<caster.var.hakureigohei>}









#Normal Attack
hakurei_gohei_leftclick: 
  Conditions:
  - itemrecharging false
  TargetConditions:
  - isMonster true
  Skills:
    - effect:lightning 
    - effect:explosion
    - damage{amount=20;ignoreArmor=true;ii=true;delay=2;ir=true}


#Right click skills
hakurei_gohei_rightclick: 
  Cooldown: 3
  OnCooldownSkill: hakurei_gohei_rightclick_onCooldown
  Conditions:
  - isCrouching false
  - varequals{name=caster.hakureigohei;value=1}
  Skills:
 
  - effect:particlesphere{particle=REDDUST;color=#ffffff;amount=600;radius=10;delay=1} @self
  - summon{type=hakurei_gohei_rightclick_marker} @self
#Rightclick skill On cooldown
hakurei_gohei_rightclick_onCooldown: 
  Cooldown: 1
  Skills:
  - randommessage{m="&cSkill on cooldown!";repeat=1} @self








#Shift + Rightclick skills:
hakurei_gohei_ShiftRightclick: 
  OnCooldownSkill: hakurei_gohei_ShiftRightclick_onCooldown
  Cooldown: 3
  Conditions:
  - isCrouching false
  - varequals{name=caster.hakureigohei;value=2}
  Skills:
  - summon{type=hakurei_gohei_ShiftRightclick_marker} @self


hakurei_gohei_ShiftRightclick_onCooldown: 
  Cooldown: 1
  Conditions:
  Skills:
  - randommessage{m="&cSkill on cooldown!";repeat=1} @self
  

  
    
  

