hakurei_gohei_skill2_marker:
  Type: marker
  Options:
  Skills:
  #function
 # - throw{velocity=3;velocityY=1;repeat=39;repeatinterval=1} @EIR{r=5;ignore=owner;shape=CUBE} ~onspawn
  - throw{velocity=20;velocityY=1} @EIR{r=5;ignore=owner;shape=CUBE} ~onspawn

  #collision box creation
  - summon{type=hakurei_gohei_skill2_collision_box_main;onsurface=false;delay=2} @selfLocation{} ~onSpawn
  #remove
  - sudoskill{delay=502;skill=hakurei_gohei_skill2_collision_box_main_summon_removeAll} @child ~onSpawn
  - remove{delay=502} @child ~onSpawn
  - remove{delay=503} @self ~onSpawn


hakurei_gohei_skill2_collision_box_main:
  Type: VEX
  Health: 100
  Options:
    NoAI: true
    Silent: true
    Invisible: true
    PreventOtherDrops: true
    VisibleByDefault: false
    Collidable: false
    Color: WHITE
  DamageModifiers:
  - SUFFOCATION 0
  Skills:
  - skill{skill=hakurei_gohei_skill2_collision_box_summon} ~onSpawn
  - skill{skill=hakurei_gohei_skill2_display} ~onSpawn
  - skill{skill=hakurei_gohei_skill2_collision_box_main_summon_removeAll} ~onDeath #Remove
  - remove{delay=1000} @self ~onSpawnorload 
