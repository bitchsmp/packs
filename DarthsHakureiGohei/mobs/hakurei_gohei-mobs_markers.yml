hakurei_gohei_rightclick_marker:
  Type: marker
  Options:
  Skills:

   - effect:particlesphere{particle=reddust;amount=600;radius=10;delay=20} @Self ~onSpawn
   - damage{a=2;pi=true;repeat=6;repeatInterval=1;delay=20;pk=true;ii=true} @EIR{r=10;target=monster} ~onSpawn
   - remove{delay=24} @self ~onSpawn 


hakurei_gohei_ShiftRightclick_marker:
  Type: marker
  Options:
  Skills:
  #function
 # - throw{velocity=3;velocityY=1;repeat=39;repeatinterval=1} @EIR{r=5;ignore=owner;shape=CUBE} ~onspawn
  - throw{velocity=20;velocityY=1} @EIR{r=5;ignore=owner;shape=CUBE} ~onspawn

  #effect
  - skill{skill=hakurei_gohei_skill2_display} @Self ~onSpawn
  #collision box creation
  - skill{skill=hakurei_gohei_skill2_collision_box_summon;delay=2} @Self ~onSpawn

  #remove
  - remove{delay=502} @child ~onSpawn
  - remove{delay=503} @self ~onSpawn

hakurei_gohei_skill3_BallTargetMarker:
  Type: Interaction
  Options:
    Width: 0.1
    Height: 0.1
    Responsive: false
  Skills:
  - remove{delay=100} @Self ~onSpawnorload 
  - sudoskill{skill=hakurei_gohei_skill3_ball_projectile;setcasterastrigger=true;delay=1} @Owner{limit=1} ~onSpawnorload 


hakurei_gohei_skill2_collision_box:
  Type: Shulker
  Options:
    NoAI: true
    Silent: true
    Invisible: true
    PreventOtherDrops: true
    VisibleByDefault: false
    Color: WHITE
  Skills:
  - showentity{}
  - remove{delay=100} ~onSpawnorload 
  DamageModifiers:
  - SUFFOCATION -1 
