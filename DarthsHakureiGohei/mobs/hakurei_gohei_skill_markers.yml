hakurei_gohei_rightclick_marker:
  Type: marker
  Options:
  Skills:

   - effect:particlesphere{particle=reddust;amount=600;radius=10;delay=20} @Self ~onSpawn
   - damage{a=2;pi=true;repeat=5;repeatInterval=1;delay=20;pk=true;ii=true} @EIR{r=10;target=monster} ~onSpawn
   - remove{delay=24} @self ~onSpawn 


hakurei_gohei_ShiftRightclick_marker:
  Type: marker
  Options:
  Skills:
  #function

  - throw{velocity=1;velocityY=1;repeat=39;repeatinterval=1} @EIR{r=5;ignore=owner;shape=CUBE} ~onspawn
  - throw{velocity=10;velocityY=3;repeat=39;repeatinterval=1} @EIR{r=3;ignore=owner;shape=CUBE}~onspawn

  #effect
  - skill{skill=hakurei_gohei_ShiftRightclick_effect;repeat=19;repeatinterval=2} @Self ~onSpawn
  #remove
  - remove{delay=42} @self ~onSpawn


    