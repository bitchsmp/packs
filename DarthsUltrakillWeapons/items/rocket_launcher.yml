rocket_launcher:
  Id: crossbow
  Display: 'S.R.S Cannon'
  Options:
    PreventStacking: true

  Skills:
    - skill{s=rocket_launcher_leftclick} ~onSwing
    - skill{s=rocket_launcher_rightclick} ~onShoot 

    - cancelevent ~onSwing 
    - cancelevent ~onAttack   
    - cancelevent ~onShoot 
    - cancelEvent ~onUse ?hasAura{aura=ROCKET_LAUNCHER_CANNONBALL_COOLDOWN} 
    - cancelEvent ~onUse ?equipslot{slot=OFFHAND}
    - cancelEvent ~onUse ?!hasitem{amount=>0;types=ultrakill_cannonball}
    - actionmessage{message="&aCannonball Assembly Factory &fis required!"} ~onUse ?!hasitem{amount=>0;types=ultrakill_cannonball}