rocket_launcher_hit_block_marker:
  Type: MARKER
  Options:
    VisibleByDefault: false
    Invisible: true
    NoGravity: true
    PreventLeashing: true
    Silent: true
    CanMove: false
    Marker: true
    Invincible: true
    summonerIsOwner: true
  Skills:
  #effect
  - throw{velocity=3;velocityY=12} @EIR{r=4;ignore=owner} ~onSpawn
  - throw{velocity=3;velocityY=12} @EIR{r=2} ~onSpawn


  - potion{type=SLOW_FALLING;duration=20} @EIR{r=4;ignore=owner} ~onSpawn
  - potion{type=SLOW_FALLING;duration=20} @EIR{r=2} ~onSpawn
  #remove
  - remove{delay=2} @self ~onSpawn
rocket_launcher_cannonball_hitbox:
  Type: interaction
  Options:
    Height: 1.45
    Width: 1.45
  Skills:
  - message{message=ouch} @AllInWorld{} ~onDamaged 
  - skill{s=rocket_launcher_cannonball_onAttacked} ~ondamaged
  - remove{delay=2} @self ~onspawn

rocket_launcher_cannonball_dataStorage:
  Type: INTERACTION
  Options:
    Width: 0
    Height: 0
    Responsive: false
  Skills:
  - message{message=bounce} @everyone ~onTimer:1 ?varequals{value=1;name=target.cannonball_bounce}
  - aura{aura=ROCKET_LAUNCHER_CANNONBALL_BOUNCED;ticks=150} ~onTimer:1 @parent ?varequals{value=1;name=target.cannonball_bounce}
  - setVar{value=0;name=target.cannonball_bounce} @self ~onTimer:1 ?varequals{value=1;name=target.cannonball_bounce}

  - remove{delay=2000} ~onSpawnorload 