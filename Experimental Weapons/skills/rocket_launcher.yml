rocket_launcher_fire:
  Skills:
  - sound{sound=ultrakill:rocketfire5;volume=0.4;radius=16} @self
  - ConsumeItemDurability{a=1} @self
  # - setvar{value=<caster.name>;type=STRING;scope=skill;var=skill.caster_name}
  # - message{message=<skill.var.caster_name>}
rocket_launcher_hit_block:
  Skills:
  - summon{type=rocket_launcher_hit_block_marker}
  - sound{s=ultrakill:explosion_harmless;audience=nearby;volume=0.8;radius=16} @Origin
rocket_launcher_hit:
  TriggerConditions:
  - entitytype{t=ARMOR_STAND} false #need improvement here: support all types of markers
  Skills:
  - skill{s=rocket_launcher_damage}
rocket_launcher_damage:
  TargetConditions:
  - onGround orelsecast rocket_launcher_damage_falling
  - isliving true

  Skills:
  - damage{a=5;preventknockback=true} @entitiesNearOrigin{r=5}
  - sound{s=ultrakill:explosion_1;volume=0.8;radius=16} @Origin
rocket_launcher_damage_falling:
  TargetConditions:
  - isliving true
  Skills:
  - damage{a=10;preventknockback=true} @entitiesNearOrigin{r=7}
  - sound{s=ultrakill:explosion_2;volume=0.8;radius=16} @Origin
  



