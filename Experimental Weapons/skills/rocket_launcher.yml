rocket_launcher_rightclick:
  Conditions:
  - hasAura{aura=ROCKET_LAUNCHER_CANNONBALL_COOLDOWN} false
  - hasitem{amount=>0;types=ultrakill_cannonball} true
  - hasitem{amount=>1;types=iron_block} orelsecast rocket_launcher_rightclick_ConditionCheck
  Skills:
  - skill{s=rocket_launcher_cannonball_projectile}
rocket_launcher_rightclick_ConditionCheck:
  Conditions:
  - hasAura{aura=ROCKET_LAUNCHER_CANNONBALL_COOLDOWN} false
  - hasitem{amount=>0;types=ultrakill_cannonball} true
  - hasitem{amount=>0;types=netherite_ingot} orelsecast rocket_launcher_cannonball_insufficient_material
  Skills:
  - skill{s=rocket_launcher_cannonball_projectile}
rocket_launcher_cannonball_insufficient_material:
  Skills:
  - actionmessage{message="Insufficient material, missing Iron Block or Netherite Ingot"}
rocket_launcher_cannonball_projectile:
  Skills:
  - projectile{bulletType=BLOCK;material=black_concrete;sfo=0;velocity=36;syo=1.4;onhitskill=rocket_launcher_cannonball_hit;cooldown=0.1;drawhitbox=false;hr=0.6;vr=0.6;hnp=true;bulletscale=1,1,1;bulletBrightnessSky=15;bulletBrightness=15;onHitBlockSkill=rocket_launcher_cannonball_hit_block;gravity=0.3;MaxRange=256;PowerAffectsVelocity=false;stopatentity=false;ontickskill=rocket_launcher_cannonball_tick;highaccuracymode=true;ImmuneDelay=1000;onstartskill=rocket_launcher_cannonball_fire;onendskill=rocket_launcher_cannonball_end;maxduration=159} @Forward{yOffset=1.4}
rocket_launcher_cannonball_fire:
  Conditions:
  Skills:

  - skill{s=rocket_launcher_cannonball_consume_iron}
  - aura{aura=ROCKET_LAUNCHER_CANNONBALL_COOLDOWN;ticks=160;ShowBarTimer=true;bartimerdisplay="Cannonball reloading..."} @self
  - command{command="say Cannonball!";asOp=true;ascaster=true} @self ~onshoot
  - summon{amount=1;onsurface=false;type=rocket_launcher_cannonball_marker;sio=true}

rocket_launcher_cannonball_consume_iron:
  Conditions:
  - hasitem{amount=>1;types=iron_block} orelsecast rocket_launcher_cannonball_consume_netherite
  Skills:
  - command{command="clear @p iron_block 2";asOp=true} @self
rocket_launcher_cannonball_consume_netherite:
  Conditions:
  - hasitem{amount=>0;types=netherite_ingot} true
  Skills:
  - command{command="clear @p netherite_ingot 1";asOp=true} @self



rocket_launcher_cannonball_tick:
  Skills:
  - summon{amount=1;onsurface=false;type=rocket_launcher_cannonball_hitbox} 
  - movevariable{from=caster.caster_name;to=target.caster_name} @Children
  # ?hasaura{aura=rocket_launcher_cannonball_boosted} is the condition to check if the cannonball was punched
  - setprojectiledirection @Forward{yOffset=1;forward=10} ?hasaura{aura=rocket_launcher_cannonball_boosted}
  - modifyprojectile{trait=VELOCITY;action=ADD;value=1} ?hasaura{aura=rocket_launcher_cannonball_boosted}
  - signal{signal=bounce} @children ?hasaura{aura=rocket_launcher_cannonball_boosted}
rocket_launcher_cannonball_hit_block:
  Skills:
  - sound{sound=ultrakill:boulder_impact_on_stones_14;volume=0.2;radius=16}
rocket_launcher_cannonball_hit:
  TargetConditions:
  - entityType{types=INTERACTION} false
  Skills:
  - sound{sound=ultrakill:metal_hit_crash_199;volume=0.3;radius=32;audience=nearby}
  - projectilevelocity{mode=SET;vy=0.3;vx=0.0;vz=-0.2} ?!hasaura{aura=ROCKET_LAUNCHER_CANNONBALL_BOUNCED}
  - skill{s=rocket_launcher_cannonball_hit_damage}
  - signal{signal=bounce} @children

rocket_launcher_cannonball_hit_damage:
  TargetConditions:
  - mobtype{types=IRON_GOLEM} castinstead rocket_launcher_cannonball_hit_golem_damage
  Skills:
  - damage{a=50;poweraffectsdamage=false}
rocket_launcher_cannonball_hit_golem_damage:
  Skills:
  - damage{a=100;poweraffectsdamage=false}
rocket_launcher_cannonball_end:
  Skills:
  - remove{delay=1} @children
  - sound{sound=ultrakill:boulder_impact_on_stones_14;volume=0.2;radius=16}
  - removeaura{aura=ROCKET_LAUNCHER_CANNONBALL_BOUNCED} @self
#Cannonball Parry Mechanics:
rocket_launcher_cannonball_onAttacked:
#@Caster: rocket_launcher_cannonball_hitbox
#@trigger: the one who punched the cannonball
  TriggerConditions:
  - holding{types=rocket_launcher} false
  Skills:
  - aura{aura=rocket_launcher_cannonball_boosted;ticks=2} @trigger
  - effect:sound{sound=ultrakill:punch_projectile;volume=0.5;radius=16} 


