HT1_Judgement:
  Skills:
  - speak{message="JUDGEMENT!"} @self
  - sound{sound=ultrakill:mp_judgement;volume=0.75;audience=world;pitch=0.75;radius=32}
  - delay 20
  - teleport{preservepitch=true;preserveyaw=true;unsafe=true} @targetLocation{forwardOffset=-1;upoffset=1}
  - setgravity{g=false}
  - delay 5  
  - aura{aura=HT1_judgement_casting;onendskill=HT1_Judgement_success;doendskillonterminate=false;ticks=5}
  - delay 7
  - setgravity{g=true}
HT1_Judgement_success:
  Skills:
  - damage{amount=18} @EIR{r=8}
  - effect:sound{sound=entity.generic.explode}
  - particle{particle=soulfire;amount=40;spread=0;speed=0.7}
HT1_parry_sfx:
  Skills:
  - effect:sound{sound=ultrakill:punch_projectile;volume=0.5;radius=16}
HT1_Judgement_parried:
  Conditions:
  Skills:
  - removeaura{aura=HT1_judgement_casting} @self
  - skill{skill=HT1_parry_sfx} @trigger
  - particle{particle=soulfire;amount=40;spread=0;speed=0.7;delay=3}