Storm_nigger:
  Id: iron_axe
  Display: '<blue><bold>Storm Breaker'
  Options:
    ItemModel: hainam:stormbreaker
  Lore:
  - 'Thors strongest weapon'
  - 'Thanos slayer'
  Skills:
  - skill{skill=[
    - cancelEvent
    - removeaura{aura=storm_nigger_noFalldamage;delay=1} @self
    ]} ~onDamaged ?hasAura{aura=storm_nigger_noFalldamage} ?DamageCause{damagecause=FALL}
  - cancelEvent ~onDamaged ?hasAura{aura=storm_nigger_noLightningdamage} ?DamageCause{damagecause=LIGHTNING}
  - skill{skill=Storm_nigger_dash;cooldown=2} @self ~onUse
  - stataura{stat=ATTACK_DAMAGE;type=ADDITIVE;value=100;ticks=2;forcesync=true} @self ~onTimer:1
  - removeaura{aura=storm_nigger_onAir_casting} @self ~onTimer:1 ?onGround